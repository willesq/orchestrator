# Test on Linux (the cheapest runner), then build the three cgo binaries on a
# native macOS arm64 runner, attach a tarball to a GitHub Release, and bump the
# Homebrew tap formula to point at it. The build needs macOS because it links a
# darwin static library; the tests do not.
#
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# The build is cgo: it links a prebuilt libtokenizers.a at build time. onnxruntime is
# NOT needed at build time (it is dlopen'd at runtime) — it's the formula's runtime dep.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

env:
  TOKENIZERS_VERSION: v1.27.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A release builds everything from its tag and restores no cache.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test (pure Go, no ORT tag)
        run: go test ./...

  release:
    needs: test
    # Apple Silicon (arm64). latest, not a pinned image: pinned images are
    # retired on GitHub's schedule (macos-14 on 2026-11-02,
    # actions/runner-images#13518), and this job only compiles Go with cgo.
    # The deployment target below keeps what users get fixed: binaries that
    # run on macOS 14 and later, whatever image builds them.
    runs-on: macos-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A release builds everything from its tag and restores no cache.
          cache: false

      - name: Fetch libtokenizers static lib (darwin-arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/lib/darwin-arm64
          gh release download "$TOKENIZERS_VERSION" --repo daulet/tokenizers \
            --pattern 'libtokenizers.darwin-arm64.tar.gz' --dir /tmp
          tar xzf /tmp/libtokenizers.darwin-arm64.tar.gz -C build/lib/darwin-arm64

      - name: Build binaries (cgo, -tags ORT)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-Lbuild/lib/darwin-arm64"
          export MACOSX_DEPLOYMENT_TARGET=14.0
          LDFLAGS="-s -w -X github.com/willesq/orchestrator/internal/version.Version=${VERSION} -X github.com/willesq/orchestrator/internal/version.Commit=${GITHUB_SHA::12}"
          for b in orch orchd orch-hook; do
            go build -tags ORT -ldflags "$LDFLAGS" -o "dist/$b" "./cmd/$b"
          done
          dist/orch version

      # --- SIGNING SEAM (future PR) -------------------------------------------
      # Insert codesign + notarization of dist/{orch,orchd,orch-hook} here,
      # BEFORE packaging, once the Apple Developer ID secrets are configured.
      # -----------------------------------------------------------------------

      - name: Package + checksum
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="orch_${VERSION}_darwin_arm64.tar.gz"
          tar -C dist -czf "$TARBALL" orch orchd orch-hook
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.tarball }}" \
            --title "$GITHUB_REF_NAME" --generate-notes

      # The formula points at the api.github.com asset endpoint, which needs the
      # numeric asset id (assigned when the asset is uploaded above).
      - name: Resolve release asset id
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.assets[] | select(.name=="'"${{ steps.package.outputs.tarball }}"'") | .id')
          if [ -z "$ASSET_ID" ]; then
            echo "::error::could not resolve asset id for ${{ steps.package.outputs.tarball }}"
            exit 1
          fi
          echo "id=$ASSET_ID" >> "$GITHUB_OUTPUT"

      # The `secrets` context is NOT allowed in `if:` conditions, so surface the
      # token's presence as a step output and gate the dispatch on that instead.
      - name: Check for tap token
        id: taptoken
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Trigger the tap's bump-formula workflow_dispatch, which updates orch.rb's
      # version / asset id / sha256 in place (no full-file rewrite). Requires
      # HOMEBREW_TAP_TOKEN to have Actions: write on willesq/homebrew-tap.
      - name: Dispatch tap formula bump
        if: steps.taptoken.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run bump-formula.yml --repo willesq/homebrew-tap \
            -f formula=orch \
            -f version="${{ steps.package.outputs.version }}" \
            -f sha256="${{ steps.package.outputs.sha256 }}" \
            -f asset_id="${{ steps.asset.outputs.id }}"

  # Orch.app, attached to the same release. Separate from the binaries because
  # the Swift dependencies need Swift 6.2 (Xcode 26, macos-26) while the cgo
  # build runs on macos-latest.
  #
  # The release always carries Orch_<version>_darwin_arm64.zip. It is
  # Developer ID signed and notarized when all the Apple secrets are set:
  #   APPLE_DEVELOPER_ID_P12           base64 of the Developer ID Application .p12
  #   APPLE_DEVELOPER_ID_P12_PASSWORD  its export password
  #   APPLE_NOTARY_API_KEY             base64 of an App Store Connect API key (.p8)
  #   APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID
  # Without them the zip is ad-hoc signed. The tap's cask is bumped for a
  # notarized build, or for an ad-hoc one only when the repository variable
  # ORCH_APP_CASK_ADHOC is "true": Gatekeeper blocks an ad-hoc app that
  # Homebrew downloaded until the user allows it, so that is an opt-in.
  app:
    needs: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The Swift dependencies need Swift 6.2 (Xcode 26); pick the newest
      # Xcode 26 the image has rather than trusting its default.
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Check for Apple signing secrets
        id: signing
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$NOTARY_KEY" ] \
             && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets not set; Orch.app is released ad-hoc signed"
          fi

      # Built before any signing material exists on the runner, so nothing that
      # runs during the dependency build can reach the Developer ID key.
      - name: Build Orch.app (ad-hoc signed)
        env:
          VERSION: ${{ needs.release.outputs.version }}
          OUT_DIR: dist-app
        run: make app

      # A throwaway keychain holds the certificate for this job only.
      - name: Import Developer ID certificate
        id: cert
        if: steps.signing.outputs.present == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/devid.p12"' EXIT
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 24)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(printf '%s' "$line" | xargs)"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in APPLE_DEVELOPER_ID_P12"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Re-signs the ad-hoc build with the hardened runtime and a secure
      # timestamp, as notarization requires.
      - name: Sign with Developer ID
        if: steps.signing.outputs.present == 'true'
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist-app/Orch.app
          codesign --verify --strict --verbose=2 dist-app/Orch.app

      - name: Notarize and staple
        if: steps.signing.outputs.present == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          ditto -c -k --keepParent dist-app/Orch.app "$RUNNER_TEMP/Orch-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Orch-notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist-app/Orch.app
          spctl --assess --type execute --verbose dist-app/Orch.app

      - name: Package + upload
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          zip="Orch_${VERSION}_darwin_arm64.zip"
          ditto -c -k --keepParent dist-app/Orch.app "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip"
          echo "sha256=$(shasum -a 256 "$zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Check for tap token
        id: taptoken
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch tap cask bump
        if: >-
          steps.taptoken.outputs.present == 'true'
          && (steps.signing.outputs.present == 'true' || vars.ORCH_APP_CASK_ADHOC == 'true')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          gh workflow run bump-cask.yml --repo willesq/homebrew-tap \
            -f cask=orch-app -f version="$VERSION" -f sha256="$SHA256"

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.present == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

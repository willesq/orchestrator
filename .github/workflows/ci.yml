# Pull-request gate for the Go code. The PR is the gate: a change reaches main
# only through a PR whose checks passed, so nothing runs on main itself, and the
# release workflow rebuilds everything from its tag rather than reusing this.
#
# Runs only when Go code, embedded assets (internal/**, including the shipped
# instruction modules) or build config change; a docs-only PR runs nothing. The
# pure-Go tests and coverage gate run on Linux, the cheapest runner. Only the
# cgo (-tags ORT) build needs macOS: it links a darwin static library, which
# Linux has no linker for. It runs after the tests pass, so a failing PR never
# spends macOS minutes. A new push cancels the PR's run still in progress.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOKENIZERS_VERSION: v1.27.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Separate from the coverage gate, which discards a failing package's
      # output and would let a failed test through as long as coverage held.
      - name: Test (pure Go)
        run: go test ./...

      - name: Per-file coverage gate
        run: make cover

  build:
    needs: test
    # Apple Silicon (arm64), the platform the release ships for; the same
    # runner and deployment target as release.yml (see there for why latest).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch libtokenizers static lib (darwin-arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/lib/darwin-arm64
          gh release download "$TOKENIZERS_VERSION" --repo daulet/tokenizers \
            --pattern 'libtokenizers.darwin-arm64.tar.gz' --dir /tmp
          tar xzf /tmp/libtokenizers.darwin-arm64.tar.gz -C build/lib/darwin-arm64

      - name: Build (cgo, -tags ORT) + smoke
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-Lbuild/lib/darwin-arm64"
          export MACOSX_DEPLOYMENT_TARGET=14.0
          for b in orch orchd orch-hook; do
            go build -tags ORT -o "build/bin/$b" "./cmd/$b"
          done
          build/bin/orch version

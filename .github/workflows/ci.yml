# Branch checks. The pure-Go tests and coverage gate run on Linux, the cheapest
# runner. Only the cgo (-tags ORT) build needs macOS: it links a darwin static
# library, which Linux has no linker for. It runs after the tests pass, so a
# failing branch never spends macOS minutes. No release.
# Push only: every branch is pushed here, and a PR shows its head commit's push
# run, so a pull_request trigger would run the same suite twice.
name: ci

on:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  TOKENIZERS_VERSION: v1.27.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Separate from the coverage gate, which discards a failing package's
      # output and would let a failed test through as long as coverage held.
      - name: Test (pure Go)
        run: go test ./...

      - name: Per-file coverage gate
        run: make cover

  build:
    needs: test
    runs-on: macos-14 # Apple Silicon (arm64), the platform the release ships for
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch libtokenizers static lib (darwin-arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/lib/darwin-arm64
          gh release download "$TOKENIZERS_VERSION" --repo daulet/tokenizers \
            --pattern 'libtokenizers.darwin-arm64.tar.gz' --dir /tmp
          tar xzf /tmp/libtokenizers.darwin-arm64.tar.gz -C build/lib/darwin-arm64

      - name: Build (cgo, -tags ORT) + smoke
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-Lbuild/lib/darwin-arm64"
          for b in orch orchd orch-hook; do
            go build -tags ORT -o "build/bin/$b" "./cmd/$b"
          done
          build/bin/orch version

  # The macOS app. Independent of the Go jobs: it only shares orchd.proto, and
  # the drift check below catches a proto change without regenerated Swift.
  # macos-26 because the Swift dependencies need Swift 6.2 (Xcode 26).
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The Swift dependencies need Swift 6.2 (Xcode 26); pick the newest
      # Xcode 26 the image has rather than trusting its default.
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Generated Swift matches orchd.proto
        run: |
          brew list protobuf >/dev/null 2>&1 || brew install protobuf
          make proto-swift
          git diff --exit-code -- macos/Sources/OrchKit/Generated

      - name: Per-file coverage gate (tests included)
        run: make app-cover

      - name: Assemble Orch.app (ad-hoc signed)
        run: make app

      # Every push gets an installable build: Actions → this run → Artifacts.
      # Ad-hoc signed, so macOS asks once before opening a downloaded copy.
      - name: Package Orch.app
        run: ditto -c -k --keepParent build/app.noindex/Orch.app "Orch-${GITHUB_SHA::12}.zip"

      - name: Upload Orch.app
        uses: actions/upload-artifact@v4
        with:
          name: Orch-app-${{ github.sha }}
          path: Orch-*.zip
          if-no-files-found: error
          retention-days: 14

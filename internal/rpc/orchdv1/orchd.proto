syntax = "proto3";

package orchd.v1;

option go_package = "github.com/willesq/orchestrator/internal/rpc/orchdv1;orchdv1";

// Orchd is the local control-plane the CLI, hooks, and MCP servers dial over a
// Unix-domain socket.
service Orchd {
  // Ping is a liveness/health check.
  rpc Ping(PingRequest) returns (PingResponse);
  // Ingest chunks, embeds, and stores text in the vector store.
  rpc Ingest(IngestRequest) returns (IngestResponse);
  // Search embeds the query and returns the top matching chunks.
  rpc Search(SearchRequest) returns (SearchResponse);
  // SearchDirectMessages is Search with chat direct messages kept in: an
  // explicit interactive search (SP-060). Every other read leaves DMs out,
  // and queued tasks are refused it (D-19).
  rpc SearchDirectMessages(SearchDirectMessagesRequest) returns (SearchResponse);
  // ListSources enumerates the distinct sources held in the vector store, with
  // per-source chunk counts. This is the store's inventory, as opposed to the
  // cadence-refresh registry that `orch source list` reports.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // ListCollections names the vector-store collections the caller may read,
  // with each one's chunk count: the base collection, and with spaces on each
  // space's own. A migration's backup is never listed: it is not read.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  // BrowseChunks pages through every stored chunk matching its filters,
  // unranked and in storage order, so a client can reach the end of a set
  // that a ranked search caps.
  rpc BrowseChunks(BrowseChunksRequest) returns (BrowseChunksResponse);
  // DeleteSource removes every chunk belonging to one source_uri.
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
  // Dispatch enqueues a durable agent-task workflow and returns its instance ID.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  // ListTasks returns dispatched tasks, newest first, optionally by status.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // GetTask returns one dispatched task by ID.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Status reports orchd's own health plus one entry per supervised subsystem.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Restart restarts one supervised subsystem in place — no process bounce.
  // An empty name restarts every subsystem.
  rpc Restart(RestartRequest) returns (RestartResponse);
  // SummarizeSession queues a finished session for a model-written summary,
  // which replaces the excerpt in its session record. It returns at once.
  rpc SummarizeSession(SummarizeSessionRequest) returns (SummarizeSessionResponse);
  // RecommendModel answers which model a task of one kind should run on, with
  // the evidence behind the answer.
  rpc RecommendModel(RecommendModelRequest) returns (RecommendModelResponse);
  // RateTask records the user's verdict on a finished task, evidence for routing.
  rpc RateTask(RateTaskRequest) returns (RateTaskResponse);
  // RetryTask runs a task again; the runner resumes its session when one
  // exists. Refused while the task's run is still active.
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  // CancelTask stops a pending or in-progress task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // WatchTasks streams task changes: a snapshot of the newest tasks, then
  // each task whose ledger row or live run changes, and a periodic tick with
  // the unsettled tasks so their liveness (last activity) stays current.
  rpc WatchTasks(WatchTasksRequest) returns (stream TaskEvent);
  // MigrateHybrid copies the RAG collection into a new hybrid one (dense plus
  // BM25 keyword vectors), re-chunking and re-embedding its text, and switches
  // to it. Without apply it only plans. The old collection is kept.
  rpc MigrateHybrid(MigrateHybridRequest) returns (MigrateHybridResponse);
  // DropBackup deletes the backup collection a migration kept; plans unless apply.
  rpc DropBackup(DropBackupRequest) returns (DropBackupResponse);
  // ReindexKeywords recomputes, in place, the BM25 keyword vectors an older
  // tokenizer made, from each chunk's stored text; counts unless apply.
  // Resumable: chunks already re-indexed are skipped.
  rpc ReindexKeywords(ReindexKeywordsRequest) returns (ReindexKeywordsResponse);
  // Relabel (SP-027) places every chunk whose labels_v is not the applied
  // spaces policy revision again and stamps it, or moves it with its vectors
  // to its space's collection; counts unless apply. Resumable. Operator only:
  // the report names spaces.
  rpc Relabel(RelabelRequest) returns (RelabelResponse);
  // ListQuarantine (SP-028) lists the sources held in quarantine, the space
  // of content that could not be placed, with their chunk counts. Operator
  // only: no session may read quarantine.
  rpc ListQuarantine(ListQuarantineRequest) returns (ListQuarantineResponse);
  // PurgeQuarantine (SP-028) deletes quarantined sources, the named ones or
  // all of them (all). It only counts unless confirm is set; orchd checks confirm,
  // so every caller opts in deliberately. Operator only.
  rpc PurgeQuarantine(PurgeQuarantineRequest) returns (PurgeQuarantineResponse);
  // RetagSource (SP-071) moves one source to the space the operator names,
  // with its vectors (nothing is re-embedded), and records a sticky
  // override that later writes of it honor. Resumable. Operator only.
  rpc RetagSource(RetagSourceRequest) returns (RetagSourceResponse);
  // BackfillSessions stores sessions again from their transcripts on disk.
  rpc BackfillSessions(BackfillSessionsRequest) returns (BackfillSessionsResponse);
  // ListPRs serves the PR babysitter's cache: the user's open PRs and PRs
  // awaiting their review, each with why it needs attention. Never calls gh.
  rpc ListPRs(ListPRsRequest) returns (ListPRsResponse);
  // GetGitHubIdentity returns the user's GitHub login, orgs and teams as gh
  // sees them; cached for 10 minutes unless refresh is set.
  rpc GetGitHubIdentity(GetGitHubIdentityRequest) returns (GitHubIdentity);
  // ListGitHubScopes returns what the GitHub watcher may monitor: the user's
  // own account (on by default) and each org they belong to (off by default).
  rpc ListGitHubScopes(ListGitHubScopesRequest) returns (ListGitHubScopesResponse);
  // SetGitHubScope turns a discovered scope on or off and sets what it covers.
  rpc SetGitHubScope(SetGitHubScopeRequest) returns (SetGitHubScopeResponse);
  // ListGitHubRepos lists the repos the user can see under an owner.
  rpc ListGitHubRepos(ListGitHubReposRequest) returns (ListGitHubReposResponse);
  // ListGitHubItems serves the watcher's cache: open PRs and issues in the
  // enabled scopes, each with why it is watched. Never calls gh.
  rpc ListGitHubItems(ListGitHubItemsRequest) returns (ListGitHubItemsResponse);
  // RequestGitHubSweep asks the watcher to search GitHub soon, spaced like any
  // other requested sweep. The caller sees the result as ListGitHubItems'
  // updated_at advancing; this RPC does not wait for it.
  rpc RequestGitHubSweep(RequestGitHubSweepRequest) returns (RequestGitHubSweepResponse);
  // ListPRReviews lists the PRs the user asked orchd to review once ready,
  // each with where its review stands and the last verdict. Never calls gh.
  rpc ListPRReviews(ListPRReviewsRequest) returns (ListPRReviewsResponse);
  // WatchPRReview starts watching a PR for review, or changes what orchd may
  // post for it: nothing (verdict), an approval on an approve verdict
  // (approve), the drafted comment on any other verdict (feedback), both
  // (auto), or the drafted comment once, now (comment). The PR is checked
  // within seconds.
  rpc WatchPRReview(WatchPRReviewRequest) returns (PRReview);
  // SetPRReviewUpdateInPlace changes whether a later comment edits orch's
  // earlier one on a watched PR, and nothing else: it never posts or reviews.
  rpc SetPRReviewUpdateInPlace(SetPRReviewUpdateInPlaceRequest) returns (PRReview);
  // StopPRReview stops watching a PR; forget also deletes its verdict.
  rpc StopPRReview(StopPRReviewRequest) returns (StopPRReviewResponse);
  // GetPRDetail reads one PR's metadata from GitHub (one gh call), cached for
  // a minute unless refresh is set.
  rpc GetPRDetail(GetPRDetailRequest) returns (PRDetail);
  // TailLogs returns orchd's recent log lines, kept in memory, after a
  // sequence number, so a caller can poll for new lines.
  rpc TailLogs(TailLogsRequest) returns (TailLogsResponse);
  // GetSystemMetrics reports resource use of orchd and the processes it runs,
  // the size of its data, and task counts.
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (SystemMetrics);
  // ListDocs lists the GitHub owners whose docs orchd keeps in sync, their
  // repos, and every doc of theirs the store holds, with its GitHub location.
  rpc ListDocs(ListDocsRequest) returns (ListDocsResponse);
  // GetDocument rebuilds one indexed source from its stored chunks.
  rpc GetDocument(GetDocumentRequest) returns (Document);
  // SyncDocs starts a docs sync now: one owner or every owner, and with force
  // a full re-ingest. Only one sync runs at a time; a request while one runs
  // is refused (Aborted), never queued.
  rpc SyncDocs(SyncDocsRequest) returns (DocsSyncState);
  // GetDocsSync reports the running docs sync, or the last one.
  rpc GetDocsSync(GetDocsSyncRequest) returns (DocsSyncState);
  // ListDocsOwners returns the owners the docs sync tracks and what each covers.
  rpc ListDocsOwners(ListDocsOwnersRequest) returns (ListDocsOwnersResponse);
  // ListDocsOwnerRepos asks GitHub for an owner's repos, to choose among them;
  // the owner need not be registered.
  rpc ListDocsOwnerRepos(ListDocsOwnerReposRequest) returns (ListDocsOwnerReposResponse);
  // SaveDocsOwner registers an owner if needed and sets whether it syncs and
  // which repos it covers. Refused while a docs sync runs.
  rpc SaveDocsOwner(SaveDocsOwnerRequest) returns (DocOwner);
  // RemoveDocsOwner forgets an owner, and with purge and confirm deletes what
  // it indexed. Refused while a docs sync runs.
  rpc RemoveDocsOwner(RemoveDocsOwnerRequest) returns (PurgeDocsResponse);
  // PurgeDocs deletes the indexed docs of repos an owner no longer covers.
  // Permanent: needs confirm. Refused while a docs sync runs.
  rpc PurgeDocs(PurgeDocsRequest) returns (PurgeDocsResponse);
  // GetConfig returns every setting, described for editing. Settings live in
  // orch.db; this and SetConfig are the only way to change them.
  rpc GetConfig(GetConfigRequest) returns (ConfigState);
  // SetConfig validates and writes settings in one write: all of them or none.
  // A value equal to the default resets the setting to follow the default.
  rpc SetConfig(SetConfigRequest) returns (ConfigState);
  // RemoveLegacyConfig deletes the config.yaml orch no longer reads, once its
  // settings were imported.
  rpc RemoveLegacyConfig(RemoveLegacyConfigRequest) returns (ConfigState);
  // SetSpacesDraft saves a spaces policy as a new draft revision. It changes
  // nothing that is enforced; the reply lists the draft's problems.
  rpc SetSpacesDraft(SetSpacesDraftRequest) returns (SpacesDraft);
  // DiffSpaces compares the enforced spaces revision with the newest draft.
  // Operator-only, like ApplySpaces: the policy names every job's orgs and
  // roots.
  rpc DiffSpaces(DiffSpacesRequest) returns (SpacesDiff);
  // ApplySpaces enforces the newest draft. Operator-only: refused to callers
  // descended from a harness or from orchd, and to any revision but the
  // newest, so the operator applies exactly what they reviewed. A draft an
  // agent session saved also needs accept_agent_draft.
  rpc ApplySpaces(ApplySpacesRequest) returns (ApplySpacesResponse);
  // ExplainPlacement says which space content from a target (a path, URL,
  // owner/repo or chat tenant) goes to and why. Agents get an answer only
  // when every space it names is public; the operator sees all.
  rpc ExplainPlacement(ExplainPlacementRequest) returns (PlacementExplanation);
  // ListSpaces lists the spaces of the applied policy: each one's kind,
  // bindings and the spaces it may read, with the policy's status.
  // Operator-only, like DiffSpaces: it names every job's orgs and roots.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  // ScanSpaces looks through folders the operator chose for git checkouts
  // and reports each one's GitHub remote, the repo's visibility and where
  // the applied policy places it, plus the GitHub orgs each gh login belongs
  // to. It writes nothing: no file, no policy revision, no binding.
  // Operator-only: it reads folders and GitHub accounts of every job.
  rpc ScanSpaces(ScanSpacesRequest) returns (ScanSpacesResponse);
  // PinSession records a session's pin at SessionStart: its harness process,
  // first directory and space. A pin's space and first directory never
  // change: a second call returns the existing pin, a subagent gets its
  // parent's, and a new session in a harness process that already holds a
  // live pin gets that one. A resumed session (source "resume") whose old
  // harness process is gone moves to the new process, keeping its space.
  // orchd reads the harness process from the caller's process tree, so only
  // a process inside a harness can pin, and only for that harness.
  rpc PinSession(PinSessionRequest) returns (SessionPin);
  // EndSession records that a pinned session ended. The pin stays for
  // retention. Only the pinned harness process can end it.
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  // ListSessions lists pinned sessions with their liveness, which orchd reads
  // from the kernel: active, idle or ended, plus running harness processes
  // with no pin (unpinned). The operator sees every session; any other caller
  // sees only its own session's row.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RecordToolEvent takes a tool call or directory change that a
  // pre-tool-use or cwd-changed hook saw. It returns once orchd has queued
  // the event and never waits on its processing. orchd attributes the event
  // to the caller it resolved from the connection, never to session_id.
  rpc RecordToolEvent(RecordToolEventRequest) returns (RecordToolEventResponse);
  // VerifyToolLog recomputes one session's or task's command log chain and
  // reports every modified, missing or moved record. Operator only.
  rpc VerifyToolLog(VerifyToolLogRequest) returns (VerifyToolLogResponse);
  // ListToolEvents reads one session's or task's command log in sequence
  // order, a page at a time. The operator reads any; a session reads only
  // its own events and a queued task only its own task's, and naming
  // another is refused (INV-12).
  rpc ListToolEvents(ListToolEventsRequest) returns (ListToolEventsResponse);
  // SummarizeToolLog sums the command log per space over a window: tool
  // calls, directory moves and moves into another space. Operator only.
  rpc SummarizeToolLog(SummarizeToolLogRequest) returns (ToolLogSummary);
  // ReplaySpaces decides one command log's recorded tool events again with
  // the guard's decision function and reports each verdict that differs
  // from the recorded one (SP-047). By default each event is decided under
  // the revision applied when it was recorded. Operator-only; it changes
  // nothing.
  rpc ReplaySpaces(ReplaySpacesRequest) returns (ReplaySpacesResponse);
  // GetEnforcement lists every enforcement layer's switch (SP-070). Open to
  // every caller, so every session's start digest can name a layer that is
  // off; who set a switch is shown to the operator only.
  rpc GetEnforcement(GetEnforcementRequest) returns (EnforcementState);
  // SetEnforcement switches one enforcement layer, optionally for a time
  // after which it reverts by itself. Operator-only: refused to callers
  // descended from a harness or from orchd. Every change is logged with its
  // time and caller and emits an event on the "spaces" stream.
  rpc SetEnforcement(SetEnforcementRequest) returns (SetEnforcementResponse);
  // SetSandboxSetting sets the sandbox setting, auto | on | off (spaces
  // D-61): whether orch writes its sandbox rules, as a lasting choice
  // apart from the sandbox layer's switch. GetEnforcement and Status show
  // it. Operator-only like SetEnforcement; every change is logged with its
  // time and caller and emits an event on the "spaces" stream.
  rpc SetSandboxSetting(SetSandboxSettingRequest) returns (SetSandboxSettingResponse);
  // ListOutboundRules lists the outbound terms check's rules (spaces
  // SP-075): the baseline rules with their state and the rules the
  // operator added, by id and kind. A rule's value is never returned
  // (INV-07). Open to every caller; who changed the rules, and the change
  // history, are shown to the operator only.
  rpc ListOutboundRules(ListOutboundRulesRequest) returns (OutboundRules);
  // ChangeOutboundRule enables, disables, adds or removes one outbound
  // rule. Operator-only like SetEnforcement: refused to callers descended
  // from a harness or from orchd. An added rule may only make the check
  // stricter. Every change is logged with its time and caller (never a
  // value) and emits an event on the "spaces" stream.
  rpc ChangeOutboundRule(ChangeOutboundRuleRequest) returns (ChangeOutboundRuleResponse);
  // GetSpaceTerms describes each applied space's outbound terms file by its
  // term count and a keyed fingerprint, never a term (spaces SP-053,
  // INV-07). Operator-only.
  rpc GetSpaceTerms(GetSpaceTermsRequest) returns (SpaceTermsList);
  // SetSpaceTerms replaces one applied space's terms file with the terms
  // sent, after they parse as a terms file. The terms are never echoed,
  // logged or returned. Operator-only, and Orch.app's alone even under an
  // unlock (D-78): replacing terms can drop some.
  rpc SetSpaceTerms(SetSpaceTermsRequest) returns (SpaceTerms);
  // ListRegisteredSources lists the sources registered for refresh on a
  // cadence (web URLs, local repos, local owner directories).
  rpc ListRegisteredSources(ListRegisteredSourcesRequest) returns (ListRegisteredSourcesResponse);
  // SaveSource adds or updates a registered source.
  rpc SaveSource(SaveSourceRequest) returns (RegisteredSource);
  // RemoveSource unregisters a source, optionally deleting what it indexed.
  rpc RemoveSource(RemoveSourceRequest) returns (RemoveSourceResponse);
  // RefreshSource refreshes one registered source, or all, now.
  rpc RefreshSource(RefreshSourceRequest) returns (RefreshSourceResponse);
  // GetSafetyNet reports how cc-safety-net is installed in Claude Code
  // against the version this orch pins, the guard rules, and the last
  // install action. Read from plugin and rule files; runs no command.
  rpc GetSafetyNet(GetSafetyNetRequest) returns (SafetyNetState);
  // InstallSafetyNet installs, upgrades or repairs cc-safety-net and the
  // orch-guards rules, and returns the resulting state. One action runs at a
  // time; a request while one runs is refused (Aborted), never queued.
  rpc InstallSafetyNet(InstallSafetyNetRequest) returns (SafetyNetState);
  // ListSettings lists the settings orch manages in other tools' files
  // (Claude Code hooks, permission rules and plugins, cc-safety-net rules),
  // each with its desired state and origin, and each provider's kinds with
  // the fields an add form needs. It reads the files first, so the list
  // reflects changes made outside orch.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  // SetSettingEnabled turns one item on or off: it is written into, or
  // taken out of, its file at once, and the choice is kept in orch.db.
  rpc SetSettingEnabled(SetSettingEnabledRequest) returns (SettingItem);
  // AddSetting validates a new item (a hook or a permission rule), writes it
  // to its file and records it as added by you.
  rpc AddSetting(AddSettingRequest) returns (SettingItem);
  // RemoveSetting deletes an item you added or orch found from its file and
  // forgets it. Items orch install writes can only be turned off.
  rpc RemoveSetting(RemoveSettingRequest) returns (RemoveSettingResponse);
  // GetTaskActivity reads what a task's session has done so far from its
  // transcript: commands, edits and reads, with risky commands marked.
  rpc GetTaskActivity(GetTaskActivityRequest) returns (TaskActivity);
  // GetPRLanding shows the commit a task proposed for its PR, checked against
  // the PR's current head, and what the user decided about it.
  rpc GetPRLanding(PRLandingRequest) returns (PRLanding);
  // ListPRLandings lists the decided landings, without calling GitHub, so the
  // app can tell which proposals still wait on the user.
  rpc ListPRLandings(ListPRLandingsRequest) returns (ListPRLandingsResponse);
  // LandPR pushes the proposed commit to the PR's branch, fast-forward only.
  rpc LandPR(LandPRRequest) returns (PRLanding);
  // UndoPRLanding pushes a new commit restoring the tree the PR had before
  // the landing. It never rewrites history.
  rpc UndoPRLanding(PRLandingRequest) returns (PRLanding);
  // DiscardPRLanding sets a proposal aside, or with restore brings it back.
  rpc DiscardPRLanding(DiscardPRLandingRequest) returns (PRLanding);
  // RequestUnlock asks Orch.app to confirm operator scope for the calling
  // process and what it starts, for at most 60 minutes, while a spaces
  // policy is applied (SP-077, D-71). It waits until Orch.app confirms or
  // denies, the request lapses, or the caller gives up. Refused inside an
  // agent session and inside tasks orchd runs.
  rpc RequestUnlock(RequestUnlockRequest) returns (RequestUnlockResponse);
  // ListUnlocks lists pending and active unlocks. Orch.app only.
  rpc ListUnlocks(ListUnlocksRequest) returns (ListUnlocksResponse);
  // ConfirmUnlock confirms or denies a pending unlock. Orch.app only. A
  // confirmed unlock shows a code in Orch.app, which the user types in the
  // requesting terminal (ProveUnlock) before anything is granted.
  rpc ConfirmUnlock(ConfirmUnlockRequest) returns (ConfirmUnlockResponse);
  // ProveUnlock sends the code Orch.app showed for a confirmed unlock, from
  // the process that asked for it; a match grants the unlock.
  rpc ProveUnlock(ProveUnlockRequest) returns (ProveUnlockResponse);
  // Lock ends unlocks: from Orch.app the one named, or all; from a
  // terminal the ones that cover the caller.
  rpc Lock(LockRequest) returns (LockResponse);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  int64 uptime_seconds = 2;
}

message IngestRequest {
  string text = 1;
  string source_uri = 2;
  string source_type = 3;
  string scope = 4;
  repeated string tags = 5;
  // started_at and ended_at date the whole text (Unix seconds; 0 = unknown).
  int64 started_at = 6;
  int64 ended_at = 7;
  // timeline dates each chunk by the time markers in its own text instead.
  bool timeline = 8;
}

message IngestResponse {
  int32 chunks = 1;
}

message SearchRequest {
  string query = 1;
  int32 top_k = 2;
  string scope = 3;        // optional exact-match filter
  string source_type = 4;  // optional exact-match filter
  repeated string tags = 5; // optional: payload.tags contains any
  string mode = 6;          // optional: "hybrid" or "dense"; empty uses rag.search.mode
  // optional: only content dated within [since, until] (Unix seconds; 0 = open)
  int64 since = 7;
  int64 until = 8;
  string source_uri = 9;        // optional: only this source's content
  repeated string all_tags = 10; // optional: payload.tags contains every one
  // optional: most hits one source may return; 0 uses rag.search.per_source,
  // negative lifts the cap
  int32 per_source = 11;
  // optional: "weighted" (source type and recency) or "plain"; empty uses
  // rag.search.ranking
  string ranking = 12;
  // optional: only these collections, as ListCollections names them. It
  // narrows what the caller's spaces let it read and never widens it; a name
  // outside them is ignored.
  repeated string collections = 13;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  // fallback says why a configured hybrid search answered by meaning only;
  // empty when the search ran as asked.
  string fallback = 2;
  // What the caller's spaces let it search (SP-031), as orchd decided them
  // from the caller alone. caller_space is the space of the caller's session
  // or queued task; empty for any other caller.
  string caller_space = 3;
  // collections are the collections searched: every one when scoped is
  // false, otherwise only the readable spaces' own.
  repeated string collections = 4;
  // scoped: the search read only the caller's readable spaces. False with
  // no spaces policy, for the operator (Orch.app), or while memory
  // filtering is switched off.
  bool scoped = 5;
}

message SearchHit {
  string text = 1;
  string source_uri = 2;
  string source_type = 3;
  float score = 4;
  string scope = 5;
  repeated string tags = 6;
  float keyword_score = 7; // BM25 score; 0 when keyword search did not find it
  bool exact = 8;          // contains, verbatim, a code identifier from the query
  // when what the hit describes happened, and when it was stored
  // (Unix seconds; 0 = unknown)
  int64 started_at = 9;
  int64 ended_at = 10;
  int64 ingested_at = 11;
  string heading = 12; // the markdown section the chunk came from, if any
  // the trust tier orchd's writer gave it: repo, web, session, file or
  // client; empty for content stored before writers were recorded
  string trust = 13;
  // space is the space orchd's placer stored the chunk in (SP-083); empty
  // with no spaces policy applied or with spaces off. Every hit is one the
  // caller may read, so its space is always one the caller reads.
  string space = 14;
  // tenant is a chat chunk's tenant, "<system>:<tenant>" (e.g.
  // slack:T0123) as its stored origin has it (a policy matches it without
  // case); empty for anything else. Both fields are stored data: a client
  // putting them in an agent's prompt must quote them like other fields.
  string tenant = 15;
  // collection is the collection the chunk was read from; point_id its
  // point there; chunk_index its place in its source (absent when unknown).
  string collection = 16;
  string point_id = 17;
  optional int32 chunk_index = 18;
}

message ListSourcesRequest {
  string source_type = 1; // optional exact-match filter
  string scope = 2;       // optional exact-match filter
  string uri_prefix = 3;  // optional prefix filter, e.g. "session://"
  int32 limit = 4;        // 0 means no cap
  // optional: only sources with content dated within [since, until]
  // (Unix seconds; 0 = open)
  int64 since = 5;
  int64 until = 6;
  // optional: only these collections; narrows as SearchRequest.collections
  repeated string collections = 7;
  // optional: only sources with chunks whose payload.tags contain any of
  // tags and every one of all_tags, as SearchRequest's
  repeated string tags = 8;
  repeated string all_tags = 9;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionInfo collections = 1; // the base first, then by name
  // spaces_on: spaces are switched on, so each space has its own collection.
  bool spaces_on = 2;
}

// CollectionInfo is one readable vector-store collection.
message CollectionInfo {
  string name = 1;
  // space is the space the collection holds; empty for the base collection.
  string space = 2;
  int64 chunks = 3;
  // hybrid: the collection has a keyword index, so hybrid search can run.
  bool hybrid = 4;
}

message BrowseChunksRequest {
  // Filters, each optional and exact-match, as SearchRequest's.
  repeated string collections = 1;
  string source_type = 2;
  string scope = 3;
  string source_uri = 4;
  repeated string tags = 5;     // payload.tags contains any
  repeated string all_tags = 6; // payload.tags contains every one
  int64 since = 7;              // Unix seconds; 0 = open
  int64 until = 8;
  // limit is the page size: 1 to 200; 0 means 50.
  int32 limit = 9;
  // cursor continues from a previous response's next_cursor; empty starts
  // at the beginning. It is opaque and valid only with the same filters.
  string cursor = 10;
}

message BrowseChunksResponse {
  // hits carry no scores: score, keyword_score and exact are zero.
  repeated SearchHit hits = 1;
  // next_cursor continues the listing; empty when this page is the last.
  string next_cursor = 2;
  // total is how many chunks match the filters, counted on the first page
  // only (cursor empty); 0 on later pages.
  int64 total = 3;
}

message ListSourcesResponse {
  repeated SourceSummary sources = 1;
  int32 total_sources = 2; // distinct sources before `limit` was applied
  int32 total_chunks = 3;  // chunks across those sources
}

// SourceSummary is one distinct source_uri and what the store holds for it.
message SourceSummary {
  string source_uri = 1;
  string source_type = 2;
  string scope = 3;
  int32 chunks = 4;
  repeated string tags = 5;
  // span of the source's dated content, and its latest store
  // (Unix seconds; 0 = unknown)
  int64 started_at = 6;
  int64 ended_at = 7;
  int64 ingested_at = 8;
}

message DeleteSourceRequest {
  string source_uri = 1;
  // confirm must be set. Deletion is unrecoverable, so the gate lives here
  // rather than only in the CLI: every caller — CLI, MCP, a direct gRPC
  // client — has to opt in deliberately, not by omission.
  bool confirm = 2;
}

message DeleteSourceResponse {
  int32 deleted = 1; // chunks removed; 0 when the source was not present
}

message DispatchRequest {
  string agent = 1;
  string body = 2;
  string cwd = 3; // optional: absolute directory the agent session runs in
  // Optional routing. model ("provider/slug") pins the model; otherwise
  // task_kind picks one from the routing table. Neither runs the agent's own.
  string task_kind = 4;
  string model = 5;
}

message DispatchResponse {
  string instance_id = 1;
  bool worker_enabled = 2; // false: the task stays pending until a worker is enabled
  Route route = 3;           // the model chosen; unset when the dispatch was unrouted
}

message ListTasksRequest {
  string status = 1; // optional: pending | in_progress | complete | failed
  string agent = 2;  // optional exact-match filter
  int32 limit = 3;   // 0 defaults to 50
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskResponse {
  Task task = 1;
  bool found = 2;
}

// Task is one dispatched agent task as recorded in orch.db.
message Task {
  string id = 1;
  string agent = 2;
  string body = 3;
  string result = 4;
  string status = 5;
  string updated_at = 6;
  // Outcome metrics, set once the task finishes.
  double cost_usd = 7;
  int64 duration_ms = 8;
  int32 turns = 9;
  string session_id = 10;
  repeated string models = 11;
  repeated string prs = 12;
  string verification = 13; // passed: … | failed: … | skipped: …
  Route route = 14;          // the model the task was dispatched to, if routed
  string rating = 15;        // good | rework | bad, set by the user
  string pr_outcome = 16;    // good | rework | bad, from the fate of the task's PRs
  TaskRun run = 17;          // liveness; set by GetTask for a pending or in-progress task
}

// TaskRun is whether anything is working on a pending or in-progress task.
message TaskRun {
  // state is running (a session is live here), waiting (its workflow is
  // queued for a worker, or will be handed out again), or stalled (nothing
  // owns it; retry or cancel it).
  string state = 1;
  int64 pid = 2;            // the agent CLI process while running, else 0
  int64 started_at = 3;     // unix seconds the current session started, else 0
  int64 last_activity = 4;  // unix seconds the session transcript last changed, else 0
  string session_id = 5;
  string cwd = 6;
  string resume_command = 7; // how to open the session yourself, when there is one
}

message StatusRequest {}

message StatusResponse {
  string version = 1;
  int64 uptime_seconds = 2;
  repeated SubsystemStatus subsystems = 3;
  // migration is set while a hybrid migration runs.
  MigrationProgress migration = 4;
  SpacesStatus spaces = 5;
}

// SpacesStatus is the spaces policy orchd enforces and any drift from it. It
// never names a space, root or org.
message SpacesStatus {
  bool configured = 1;        // a policy with at least one space is applied
  int64 applied_revision = 2; // 0: nothing applied
  int64 draft_revision = 3;   // newest saved revision when not the applied one
  // drift: "draft" (a saved draft is not applied) and/or
  // "changed_outside_orchd" (orch.db's applied revision was edited).
  repeated string drift = 4;
  string error = 5;
  // The enforcement switches that stop their layer enforcing (SP-070).
  repeated EnforcementSwitch relaxed = 6;
  // Set when orch.db's switches differ from orchd's or could not be read.
  string enforcement_error = 7;
  // The sandbox setting (D-61); unset when spaces are unavailable.
  SandboxSetting sandbox = 8;
  // What quarantine holds (SP-028); unset when spaces are unavailable or
  // the store could not be counted.
  QuarantineCounts quarantine = 9;
  // counts (SP-031) is what the spaces hold, as the caller may see it;
  // unset with no policy configured.
  SpacesCounts counts = 10;
  // state is the memory spaces switch (spaces.enabled): "on", "off", or
  // "turning_on" while the store is split back into the spaces' collections
  // before enforcement starts. Empty from an orchd that predates the
  // switch, which always enforces.
  string state = 11;
  // store_move is the switch's store move while one runs, or the last one
  // when it stopped with an error; unset otherwise.
  SpacesStoreMove store_move = 12;
}

// SpacesStoreMove is how far the spaces switch's store move has got: a
// merge of every space's collection into the base (spaces turned off) or a
// split of the base back into them (turned on). It names no source or space.
message SpacesStoreMove {
  string direction = 1;       // "merge" or "split"
  bool running = 2;
  int32 collections = 3;      // collections read from
  int32 collections_done = 4;
  int32 sources = 5;          // moved so far
  int32 chunks = 6;
  int32 failed = 7;           // chunks left where they were; the next run retries
  int64 started_at = 8;       // unix seconds
  string error = 9;           // why it stopped; it runs again
}

// QuarantineCounts is how much content quarantine holds. It never names a
// source.
message QuarantineCounts {
  int32 sources = 1;
  int32 chunks = 2;
}

// SpacesCounts is how much content the spaces hold and how far a relabel has
// got (SP-031). The operator (Orch.app) sees every space; any other caller
// sees only the spaces it reads (its own and public ones), and the relabel
// totals cover only those.
message SpacesCounts {
  repeated SpaceCount spaces = 1; // by name
  // every_space is set when spaces lists every space of the policy.
  bool every_space = 2;
  // Chunks counted and how many of them the applied revision has not yet
  // labelled ('orch rag relabel' brings them up to it). For the operator
  // they cover every collection: unplaced content and quarantine too.
  int32 chunks = 3;
  int32 stale = 4;
  // conflicts are live sessions whose first folder two isolated spaces
  // claim under the applied policy, so they have no space. Counted for the
  // operator only (conflicts_counted).
  int32 conflicts = 5;
  bool conflicts_counted = 6;
  int64 counted_at = 7; // unix seconds the counts were taken
  // error says why the store could not be counted; the other fields are
  // then empty.
  string error = 8;
}

// SpaceCount is one space's collection.
message SpaceCount {
  string space = 1;
  string kind = 2;   // public | private | isolated
  int32 chunks = 3;
  int32 stale = 4;   // not yet labelled by the applied revision
}

// MigrationProgress is how far a running hybrid migration has got.
message MigrationProgress {
  string target = 1;
  int32 sources_done = 2;
  int32 sources_total = 3;
  int32 chunks = 4;      // chunks written to the target so far
  int64 started_at = 5;  // unix seconds
}

// SubsystemStatus is one supervised unit's liveness, as `orch status` prints it.
message SubsystemStatus {
  string name = 1;
  string state = 2;       // running | stopped | failed
  string detail = 3;      // static descriptor, e.g. the qdrant port
  string error = 4;       // last start/stop failure, empty when healthy
  int64 started_at = 5;   // unix seconds; 0 when never started
  int64 last_beat = 6;    // unix seconds of the last tick; 0 when not tick-driven
  int32 restarts = 7;
}

message RestartRequest {
  string name = 1; // empty restarts every subsystem
}

message RestartResponse {
  repeated string restarted = 1;
}

message SummarizeSessionRequest {
  string session_id = 1;
  string transcript_path = 2; // absolute path to the harness's .jsonl transcript
  repeated string tags = 3;   // tags for the session record, as the hook ingested it
}

message SummarizeSessionResponse {
  bool accepted = 1; // false when summaries are off or the queue is full
}

// Route is one model choice for a task kind.
message Route {
  string task_kind = 1;
  string provider = 2;
  string model = 3;
  string effort = 4;     // empty: the model's default
  string rationale = 5;
  int32 evidence_n = 6;  // observed outcomes behind the choice
  string confidence = 7; // low | medium | high
}

message RecommendModelRequest {
  string task_kind = 1;
}

message RecommendModelResponse {
  Route route = 1;
  // false when the routing table had no usable route and the answer is a live
  // proposal from the declared-capability policy.
  bool from_table = 2;
}

message RateTaskRequest {
  string id = 1;
  string rating = 2; // good | rework | bad
}

message RateTaskResponse {}

message RetryTaskRequest {
  string id = 1;
}

message RetryTaskResponse {
  string run_id = 1; // the new workflow run
}

message CancelTaskRequest {
  string id = 1;
}

message CancelTaskResponse {
  string outcome = 1; // what happened, for the user
}

message WatchTasksRequest {
  string status = 1; // optional filter for the snapshot and changes, as ListTasks
  int32 limit = 2;   // snapshot size; 0 defaults to 50, max 500
}

// TaskEvent is one message of a WatchTasks stream.
message TaskEvent {
  // kind is snapshot (the newest tasks, replacing whatever the client
  // holds), changed (tasks whose state changed), or tick (the pending and
  // in-progress tasks' id, status, updated_at and run only: liveness to
  // merge into rows the client already has).
  string kind = 1;
  repeated Task tasks = 2;
}

message MigrateHybridRequest {
  string target = 1; // empty: <active collection>-hybrid
  bool apply = 2;    // false plans only
}

message MigrateHybridResponse {
  string from = 1;
  string to = 2;
  int32 sources = 3;
  int32 old_chunks = 4;
  int32 new_chunks = 5;
  int32 skipped = 6;
  bool applied = 7;
  int32 malformed = 8;  // sources whose chunk order could not be trusted; kept in stored order
  int32 orphans = 9;    // chunks with no source URI, which cannot be migrated
  int32 removed = 10;   // sources the target held that no longer exist
  int32 oversize = 11;  // sources too large to migrate; an applied run will not switch while any remain
  repeated string problems = 12; // some affected sources, and why
  string error = 13;             // set when the run failed or refused to switch; the counts are still reported
}

// DropBackupRequest names no collection: orchd only ever drops the backup
// recorded in config.
message DropBackupRequest {
  bool apply = 1;
}

message DropBackupResponse {
  string collection = 1;
  int64 points = 2;
  bool dropped = 3;
}

message BackfillSessionsRequest {
  bool all = 1;       // every stored transcript, not only undated sessions; leaves records alone
  bool summaries = 2; // with all, also write each session's summary again (a model call each)
  bool apply = 3;     // false only reports the plan
}
message BackfillSessionsResponse {
  int32 total = 1;   // sessions in the store
  int32 todo = 2;    // sessions to store again
  int32 dated = 3;   // already dated, so left alone
  int32 missing = 4; // no transcript on disk
  int32 handed = 5;  // handed to orchd by this call
  int32 waiting = 6; // already waiting on orchd, so left to it
}

message ReindexKeywordsRequest {
  bool apply = 1;
}
message ReindexKeywordsResponse {
  string collection = 1;
  int32 tokenizer_version = 2;
  int64 total = 3;   // chunks in the collection
  int64 stale = 4;   // chunks an older tokenizer indexed, before this run
  int64 updated = 5; // chunks this run re-indexed
  bool applied = 6;
  string error = 7;  // why an applied run stopped early; what it did is still reported
}

message RelabelRequest {
  bool apply = 1;
}
// RelabelTransition counts stale chunks by the space they were in
// ("unplaced" for none) and the space they were placed in.
message RelabelTransition {
  string from = 1;
  string to = 2;
  int64 chunks = 3;
}
// RelabelResponse holds counts and space names only: never a source, its
// text or a collection.
message RelabelResponse {
  int64 revision = 1; // the applied policy revision chunks were brought up to
  int64 total = 2;    // chunks in every collection
  int64 stale = 3;    // chunks not labelled by revision, before this run
  int64 changed = 4;  // chunks stamped or moved (or, without apply, that would be)
  int64 moved = 5;    // of those, chunks that changed collection
  int64 failed = 6;   // stale chunks left stale, to be retried by the next run
  repeated RelabelTransition transitions = 7;
  bool applied = 8;
  string error = 9;   // why an applied run stopped early; what it did is still reported
}

message ListQuarantineRequest {}

// QuarantineSource is one source held in quarantine.
message QuarantineSource {
  string source_uri = 1;
  string source_type = 2;
  int32 chunks = 3;
  int64 ingested_at = 4; // unix seconds of its latest store; 0 = unknown
}

message ListQuarantineResponse {
  repeated QuarantineSource sources = 1; // by source_uri
  int32 total_sources = 2;
  int32 total_chunks = 3;
}

message PurgeQuarantineRequest {
  // source_uris names the quarantined sources to delete. A named source
  // that is not in quarantine is refused, never deleted elsewhere.
  repeated string source_uris = 1;
  // confirm must be set to delete; without it the purge only counts.
  bool confirm = 2;
  // all purges every quarantined source. It must be set when source_uris is
  // empty and is refused with it, so an empty list sent by mistake never
  // purges everything.
  bool all = 3;
}

message PurgeQuarantineResponse {
  int32 sources = 1; // sources deleted, or that would be without confirm
  int32 chunks = 2;  // their chunks
  bool purged = 3;   // false for a dry run
}

message RetagSourceRequest {
  string source_uri = 1;
  string space = 2;        // a space of the applied policy, or "quarantine"
  // Required to move a source into a public space, out of an isolated one,
  // or out of quarantine into a space; without it such a retag is refused
  // and nothing changes.
  bool confirm = 3;
  // When set, the retag is refused unless the source is stored in this
  // space now (checked under the source's lock, with the move).
  string expect_from = 4;
}
// RetagSourceResponse names spaces and counts only.
message RetagSourceResponse {
  repeated string from = 1; // spaces that held the source ("unplaced" for none)
  int64 chunks = 2;         // the source's chunks in the target space after the retag
  bool moved = 3;           // false when it was only stamped where it was
}

message ListPRsRequest {
  bool needs_me = 1; // only PRs that need attention
}

// ListPRsResponse lists PRs most urgent first (attention order, then repo and
// title).
message ListPRsResponse {
  repeated PullRequest prs = 1;
  int64 updated_at = 2; // unix seconds the cache was last written; 0 = never
}

message PullRequest {
  string url = 1;
  string title = 2;
  string repo = 3;             // owner/name
  string ci_state = 4;         // success | failure | pending | none
  string review_decision = 5;  // APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED | empty
  string mergeable = 6;        // MERGEABLE | CONFLICTING | UNKNOWN
  bool is_draft = 7;
  repeated string reasons = 8; // authored | review_requested
  // why it needs the user, most urgent reason only: ci_failed |
  // changes_requested | conflicts | review_requested | ready_to_merge; empty
  // when it does not
  string attention = 9;
}

message GetGitHubIdentityRequest {
  bool refresh = 1; // bypass the 10-minute cache
}

message GitHubIdentity {
  string login = 1;
  repeated string orgs = 2;
  repeated GitHubTeam teams = 3;
}

message GitHubTeam {
  string org = 1;
  string slug = 2;
  string name = 3;
}

message ListGitHubScopesRequest {
  bool refresh = 1; // rediscover orgs now rather than from the cache
}

message ListGitHubScopesResponse {
  repeated GitHubScope scopes = 1; // the user's account first, then orgs by name
  // set when GitHub could not be reached; the stored scopes are still listed
  string warning = 2;
}

message GitHubScope {
  string owner = 1;
  string kind = 2;      // user | org; fixed by discovery
  bool enabled = 3;
  string items = 4;     // involving | all
  string repo_mode = 5; // all | include | exclude
  repeated string repos = 6; // repo names within owner, for include/exclude
  int64 updated_at = 7; // unix seconds
  // repo names within owner watched for every open item while items is
  // involving; kept but ignored while items is all
  repeated string everything_repos = 8;
}

message SetGitHubScopeRequest {
  // owner must be an existing scope; kind is ignored
  GitHubScope scope = 1;
}

message SetGitHubScopeResponse {
  GitHubScope scope = 1;
}

message ListGitHubReposRequest {
  string owner = 1;
}

message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1; // by name
}

message GitHubRepo {
  string name = 1;
  bool private = 2;
  bool archived = 3;
}

message ListGitHubItemsRequest {
  string kind = 1;  // optional: pr | issue
  string owner = 2; // optional: one account or org
}

// ListGitHubItemsResponse lists items most urgent first (PRs needing the
// user, by attention), then by repo and title.
message ListGitHubItemsResponse {
  repeated GitHubItem items = 1;
  int64 updated_at = 2; // unix seconds the cache was last written; 0 = never
}

message RequestGitHubSweepRequest {}

message RequestGitHubSweepResponse {}

message GitHubItem {
  string url = 1;
  string title = 2;
  string repo = 3;        // owner/name
  string kind = 4;        // pr | issue
  int32 number = 5;
  string author = 6;
  string updated_at = 7;  // RFC 3339
  bool is_draft = 8;
  string ci_state = 9;    // PRs the user authored or was asked to review
  string review_decision = 10;
  string mergeable = 11;
  // authored | assigned | review_requested | involved | all_open
  repeated string reasons = 12;
  string attention = 13;  // as on PullRequest; empty for issues
}

message TailLogsRequest {
  uint64 after_seq = 1; // only lines newer than this; 0 = from the oldest kept
  string source = 2;    // optional: one source, such as orchd or qdrant
  int32 limit = 3;      // most lines to return, newest kept; 0 = 500
}

message TailLogsResponse {
  repeated LogEntry entries = 1; // oldest first
  uint64 last_seq = 2;   // newest sequence logged; pass back as after_seq
  uint64 oldest_seq = 3; // oldest still kept; a gap means lines were dropped
  repeated string sources = 4; // every source seen so far, sorted
}

message LogEntry {
  uint64 seq = 1;
  int64 at_unix_ms = 2;
  string source = 3;
  string message = 4;
}

message GetSystemMetricsRequest {}

message SystemMetrics {
  int64 at_unix_ms = 1;
  repeated ProcessMetrics processes = 2;
  int32 goroutines = 3;
  uint64 heap_bytes = 4;     // orchd's live Go heap
  repeated DataSize data = 5;
  map<string, int32> tasks = 6; // task count by status
}

// ProcessMetrics describes one OS process orchd runs or depends on.
message ProcessMetrics {
  string name = 1;  // orchd | qdrant
  int32 pid = 2;    // 0 when not running
  uint64 rss_bytes = 3;
  double cpu_percent = 4; // of one core, since the previous call (or start)
  int64 uptime_seconds = 5;

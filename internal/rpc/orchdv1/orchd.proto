}

message SaveDocsOwnerRequest {
  string owner = 1;
  bool enabled = 2;
  string repo_mode = 3; // all | include | exclude
  repeated string repos = 4;
  int64 refresh_secs = 5; // 0 keeps the cadence, or the default for a new owner
}

message RemoveDocsOwnerRequest {
  string owner = 1;
  bool purge = 2;   // also delete everything the owner indexed
  bool confirm = 3; // required with purge: deletion is permanent
}

message PurgeDocsRequest {
  string owner = 1;
  // Repos to purge, which the owner must not cover. Empty means every repo
  // the owner no longer covers.
  repeated string repos = 2;
  bool confirm = 3; // required: deletion is permanent
}

message PurgeDocsResponse {
  int32 purged_sources = 1; // indexed docs deleted
  int32 purged_chunks = 2;
}

message GetConfigRequest {}

message SetConfigRequest {
  map<string, string> values = 1; // key → JSON value
  bool confirm_sensitive = 2;     // required to change a sensitive setting
}

message ConfigField {
  string key = 1;
  string section = 2;
  string label = 3;
  string help = 4;
  string type = 5; // bool | int | float | string | duration | enum | path | url | version | list | map
  string value = 6;         // current effective value, JSON
  string default_value = 7; // JSON
  repeated string options = 8; // enum
  bool has_range = 9;
  double min = 10;
  double max = 11;
  bool sensitive = 12;   // changing it needs confirm_sensitive
  bool live = 13;        // takes effect without restarting orchd
  reserved 14;           // env_override: settings are no longer read from the environment
  reserved "env_override";
  bool pending_restart = 15; // differs from what orchd started with
  bool overridden = 16;      // set away from its default
}

message ConfigState {
  repeated ConfigField fields = 1;
  reserved 2;                   // path: settings are no longer kept in a file
  reserved "path";
  bool restart_required = 3;    // some field is pending_restart
  string legacy_file = 4;       // a config.yaml orch no longer reads, still on disk; empty if none
  // Why orchd could not start its services, when it runs only to let the
  // settings be fixed; empty when it started normally.
  string startup_error = 5;
}

message RemoveLegacyConfigRequest {}

message SetSpacesDraftRequest {
  string policy_json = 1; // a spaces.Policy document
}

// SpacesProblem is one check a spaces policy failed.
message SpacesProblem {
  string rule = 1;
  string space = 2;
  string message = 3;
}

message SpacesDraft {
  int64 revision = 1;
  string sha256 = 2;
  repeated SpacesProblem problems = 3;
}

message DiffSpacesRequest {}

// SpacesChange is how one space differs between the applied revision and the
// draft. An empty space is the policy's own fields.
message SpacesChange {
  string space = 1;
  string kind = 2; // added | removed | changed
  repeated string fields = 3;
  repeated string details = 4; // the values, one line per field
}

message SpacesDiff {
  int64 applied_revision = 1; // 0: nothing applied
  string applied_json = 2;
  int64 draft_revision = 3;   // 0: no draft newer than the applied revision
  string draft_json = 4;
  repeated SpacesChange changes = 5;
  repeated SpacesProblem problems = 6; // the draft's
  string draft_created_by = 7;
  int64 draft_created_at = 8;  // unix seconds
  bool draft_by_operator = 9;  // false: an agent session saved it
  // Applied GitHub orgs whose new content goes to quarantine: a sync saw a
  // different node ID, or none was confirmed. Confirm one at the next apply.
  repeated string unconfirmed_github_orgs = 10;
}

message ApplySpacesRequest {
  int64 reviewed_revision = 1;
  // accept_agent_draft confirms the operator reviewed a draft an agent
  // session saved; without it such a draft is refused.
  bool accept_agent_draft = 2;
  // confirm_github_orgs accepts the changed identity (node ID) of these
  // bound GitHub orgs; without it, an org whose node ID changed since it was
  // bound is refused.
  repeated string confirm_github_orgs = 3;
}

message ApplySpacesResponse {
  int64 applied_revision = 1;
}

message ExplainPlacementRequest {
  // An absolute path, an http(s) URL, owner/repo, or a chat tenant as
  // slack:<id>, teams:<id> or slack://<id>/...
  string target = 1;
}

// PlacementRoot is one bound folder root holding the target.
message PlacementRoot {
  string root = 1;
  string space = 2;
  string kind = 3;
}

// PlacementRemote is what the target's GitHub repo contributes.
message PlacementRemote {
  string owner = 1; // the current owner, as GitHub reports it when checked
  string repo = 2;
  string visibility = 3; // public | private | "" (not checked)
  string space = 4;      // the owner's space, "" when unbound
  string kind = 5;
  string effect = 6;
}

message PlacementExplanation {
  string target_kind = 1; // path | url | repo | chat
  // Every bound root holding the target, shallowest first; the last decides.
  repeated PlacementRoot roots = 2;
  PlacementRemote remote = 3;
  string rule = 4; // the deciding rule
  string reason = 5;
  string outcome = 6; // placed | quarantined | conflict
  string space = 7;
  // For a path: where a session started there writes, and the space whose
  // reads it gets ("" for none: public only).
  string session_space = 8;
  string session_reads = 9;
}

message ListSpacesRequest {}

// SpaceInfo is one space of the applied policy, as the operator wrote it.
message SpaceInfo {
  string name = 1;
  string kind = 2; // public | private | isolated
  repeated string github_orgs = 3;
  repeated string roots = 4;
  repeated string web_prefixes = 5;
  repeated string chat = 6;
  // reads are the spaces it lists; readable is every space it may read:
  // itself, every public space and the ones it lists.
  repeated string reads = 7;
  repeated string readable = 8;
  string terms_file = 9; // the outbound term list's path, never its terms
  string gh_config_dir = 10;
}

message ListSpacesResponse {
  SpacesStatus status = 1;
  repeated SpaceInfo spaces = 2; // by name
  // Where sessions pinned under a public root write.
  string public_root_sessions = 3;
  // Which gh login and Claude Code configuration each space uses and
  // whether each is logged in (SP-074, D-59), by space name. Status
  // metadata only: never a token.
  repeated SpaceLogin logins = 4;
}

// SpaceLogin is one space's gh login and Claude Code configuration.
message SpaceLogin {
  string space = 1;
  LoginState gh = 2;
  LoginState claude = 3;
}

// LoginState is one login a space uses, from 'gh auth status' or
// 'claude auth status'.
message LoginState {
  // own: the space names its own folder (gh_config_dir or
  // claude_config_dir); false is the default login or configuration.
  bool own = 1;
  string dir = 2;     // that folder; "" for the default
  string state = 3;   // logged in | not logged in | refused | unknown
  // The gh account name, or Claude Code's sign-in method (e.g. claude.ai).
  string account = 4;
  // Where gh keeps the token: keyring | file | the variable it came from;
  // "" for Claude Code.
  string storage = 5;
  string detail = 6;  // why, for any state but logged in
}

message ScanSpacesRequest {
  // Absolute folders to look through. Each is walked without following
  // symbolic links, skipping hidden folders, and a checkout's own folders
  // are not entered.
  repeated string folders = 1;
  int32 max_depth = 2; // folders below each one; 0 means 3, at most 6
  // Ask GitHub nothing: visibility comes only from orchd's cache and no
  // account's orgs are listed.
  bool offline = 3;
}

// ScannedCheckout is one git checkout a scan found.
message ScannedCheckout {
  string path = 1;
  string owner = 2; // the origin's GitHub owner; "" for none
  string repo = 3;
  string visibility = 4; // public | private | "" (not known)
  // anonymous: its .git does not follow git's layout, so its remote is
  // not believed and it is placed by its folder alone.
  bool anonymous = 5;
  // Where the applied policy places the checkout's content.
  string space = 6;
  string rule = 7;
  string outcome = 8; // placed | quarantined | conflict
  string reason = 9;
}

// ScannedAccount is a gh login and the orgs it belongs to: the default
// login, and each space's gh profile.
message ScannedAccount {
  string profile = 1; // "" for the default login, else the space's name
  string login = 2;
  repeated string orgs = 3;
  string error = 4;
}

message ScanSpacesResponse {
  repeated ScannedCheckout checkouts = 1; // by path
  repeated ScannedAccount accounts = 2;
  // Set when a limit stopped the walk early.
  bool truncated = 3;
  // Folders that could not be read, and why.
  repeated string problems = 4;
}

message PinSessionRequest {
  string session_id = 1; // ^[A-Za-z0-9_-]{1,128}$
  // The session's directory as the hook reports it. A new pin is refused
  // unless it is the harness process's own working directory.
  string cwd = 2;
  // Set for a subagent: it gets its parent's pin and cannot set its own.
  string parent_session_id = 3;
  // Why SessionStart fired: startup | resume | clear | compact. Only
  // "resume" lets an existing pin move to a new harness process.
  string source = 4;
}

// SessionPin is the identity every later decision about a session uses. It
// is written at SessionStart. Its space and first directory never change; a
// resume moves it to a new harness process, and ended_at is set when the
// session ends.
message SessionPin {
  string session_id = 1;
  string harness = 2;     // claude | codex
  int64 harness_pid = 3;
  // The harness process's start time in unix nanoseconds: with the PID it
  // names that process for its whole life.
  int64 harness_started = 4;
  string first_cwd = 5;
  string main_checkout = 6; // "" outside a git checkout
  // The space the session writes to: "" with no spaces policy applied,
  // "quarantine" when its directory cannot be placed.
  string space = 7;
  int64 policy_revision = 8; // the applied spaces revision; 0 for none
  int64 pinned_at = 9;       // unix seconds
  int64 ended_at = 10;       // unix seconds; 0 while not ended
  // The session whose pin this one copied (a subagent's parent, or an
  // earlier session in the same harness process); "" for its own.
  string inherited_from = 11;
}

message EndSessionRequest {
  string session_id = 1;
}

message EndSessionResponse {
  int64 ended_at = 1; // unix seconds; the first end recorded wins
}

message ListSessionsRequest {
  bool all = 1; // include ended sessions
}

// SessionInfo is one row of ListSessions.
message SessionInfo {
  string harness = 1;    // claude | codex | gemini
  string session_id = 2; // "" when unpinned
  int64 harness_pid = 3;
  string space = 4;      // "" with no spaces policy applied, or unpinned
  string first_cwd = 5;  // the pinned directory; "" when unpinned
  // active: the process runs and a hook event came in the last 30 minutes;
  // idle: it runs with no event for 30 minutes or more; ended: SessionEnd
  // came or the process is gone; unpinned: a harness process with no pin.
  string state = 6;
  // Unix seconds of the latest of: the pin, its last resume, and its last
  // logged tool event; 0 when unpinned.
  int64 last_activity = 7;
  int64 tool_events = 8; // tool events in the command log
  int64 refusals = 9;    // of those, calls the tool guard refused
  int64 ended_at = 10;   // unix seconds; 0 while not ended
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// RecordToolEventRequest is one hook event as the harness reported it. Every
// field is the harness's claim; orchd decides whom it belongs to.
message RecordToolEventRequest {
  string event = 1;      // pre-tool-use | cwd-changed
  string session_id = 2; // ^[A-Za-z0-9_-]{1,128}$
  string cwd = 3;
  string tool_name = 4;  // pre-tool-use only
  // The tool's input JSON as the harness sent it; empty when larger than
  // 1 MiB, with tool_input_size still set.
  bytes tool_input = 5;
  int64 tool_input_size = 6;
  string tool_use_id = 7;
  string agent_id = 8;   // set for a subagent's tool call
  string agent_type = 9;
  string old_cwd = 10;   // cwd-changed only
  string new_cwd = 11;   // cwd-changed only
  int64 at = 12;         // unix nanoseconds when the hook started
  // The tool guard's decision as the hook made it (SP-041); empty when no
  // guard ran (an older hook). guard_verdict is what the guard decided or,
  // when not enforced, would have decided: allow | refuse.
  string guard_verdict = 13;
  string guard_rule = 14;     // a rule id; never a path or text
  bool guard_enforced = 15;   // the verdict took effect
  int64 guard_policy_rev = 16;
  // The outbound rules revision the hook's terms check judged under
  // (spaces SP-075, D-66), from the guard snapshot; 0 for the baseline.
  // Unset from an older hook: orchd then records its own revision.
  optional int64 guard_rules_rev = 17;
}

message RecordToolEventResponse {}

message VerifyToolLogRequest {
  string owner = 1; // a session ID, or task:<task id>
}

message ToolLogProblem {
  int64 seq = 1;
  string detail = 2;
}

message VerifyToolLogResponse {
  int32 records = 1;
  int32 anchors = 2;          // chain heads anchored at SessionEnd
  int32 ends = 3;             // SessionEnd records
  int32 gaps = 4;             // records saying events were dropped
  int64 dropped = 5;          // events those gap records count
  repeated ToolLogProblem problems = 6; // empty when the chain is intact
  int64 pruned = 7;           // retention (SP-015) may have deleted records up to this seq; 0 for none
}

message ListToolEventsRequest {
  // A session ID or task:<task id>; "" for the caller's own session or task.
  string owner = 1;
  int64 after_seq = 2; // records after this sequence number; 0 from the start
  int32 limit = 3;     // at most this many; 0 or above 1000 means 1000
}

// ToolEvent is one record of a command log, as stored: text fields are
// credential-redacted and capped.
message ToolEvent {
  int64 seq = 1;
  int64 at = 2;          // unix nanoseconds when orchd took the event
  string kind = 3;       // event | gap | end
  string harness = 4;
  string event = 5;      // pre-tool-use | cwd-changed
  string tool = 6;
  string agent_id = 7;   // set for a subagent's tool call
  string agent_type = 8;
  string cwd = 9;
  string old_cwd = 10;   // cwd-changed only
  string new_cwd = 11;   // cwd-changed only
  string command = 12;
  string targets = 13;   // the call's targets as JSON
  string decision = 14;  // logged | refused | not enforced
  // The guard's rule; for a call it did not enforce (decision logged or
  // not enforced), the verdict it would have given: "would refuse (<rule>)".
  string rule = 15;
  int64 dropped = 16;    // gap records: events lost before they were stored
  // The session the hook named, when orchd attributed the event elsewhere.
  string claimed_session = 17;
}

message ReplaySpacesRequest {
  // A session ID, task:<task id> or process:<pid>[-<start>].
  string owner = 1;
  // The policy to decide under, instead of each event's recording
  // revision: a saved revision, or a policy document. At most one.
  int64 policy_revision = 2;
  string policy_json = 3;
  // The guard mode to judge in: off | log | block-other-jobs | strict; ""
  // for the guard switch's current state.
  string mode = 4;
  // Return every replayed event, not only the changed ones.
  bool all = 5;
}

// ReplayedEvent is one event's recorded and replayed verdicts.
message ReplayedEvent {
  int64 seq = 1;
  int64 at = 2; // unix nanoseconds when it was recorded
  string event = 3;
  string tool = 4;
  int64 policy_revision = 5; // applied when it was recorded; 0 for none
  bool recorded = 6;         // the record carries a verdict
  string recorded_verdict = 7;
  string recorded_rule = 8;
  string verdict = 9; // allow | refuse; "" when it could not be decided
  string rule = 10;
  bool changed = 11;
  string problem = 12;
}

message ReplaySpacesResponse {
  string owner = 1;
  string mode = 2;       // the mode judged in
  string pin_space = 3;  // the owner's pinned space; "" for none
  bool pinned = 4;
  int64 events = 5;      // events replayed
  int64 compared = 6;    // with a recorded verdict
  int64 changed = 7;
  int64 unrecorded = 8;  // with no recorded verdict
  int64 problems = 9;    // that could not be decided
  // The changed events (with all, every event), in sequence order.
  repeated ReplayedEvent rows = 10;
  // Set when the log held more events than one replay reads.
  bool truncated = 11;
}

message ListToolEventsResponse {
  string owner = 1; // the chain read, as "<session id>" or "task:<id>"
  repeated ToolEvent events = 2;
  // Records after the last one returned remain. A page holds fewer than
  // the limit when its records reach about 3 MiB (512 KiB for an agent).
  bool more = 3;
  int64 pruned = 4; // retention may have deleted records up to this seq
}

message SummarizeToolLogRequest {
  int64 since = 1; // unix seconds; 0 for the last 7 days
}

// SpaceToolActivity is one space's line of the summary. Sessions are
// counted in the space they are pinned to; queued tasks, which have no
// space yet, and sessions pinned with no policy applied are under "".
message SpaceToolActivity {
  string space = 1;
  int32 sessions = 2;          // sessions and tasks with events in the window
  int64 tool_calls = 3;        // pre-tool-use events
  int64 directory_moves = 4;   // cwd-changed events
  // Moves whose new directory a session would be pinned to another space
  // for, under the policy applied now.
  int64 cross_space_moves = 5;
  int64 refusals = 6;          // calls the tool guard refused
}

message ToolLogSummary {
  int64 since = 1; // unix seconds
  int64 until = 2; // unix seconds
  repeated SpaceToolActivity spaces = 3;
  // Directory moves not checked for a space change because the window
  // names too many distinct directories.
  int64 unplaced_moves = 4;
}

message DocRepo {
  string repo = 1;
  string head_sha = 2; // the default-branch commit last indexed
  int64 last_synced = 3;
  int32 files = 4;
  string status = 5;
  string web_url = 6; // https://github.com/<owner>/<repo>
  string error = 7;   // why the repo's last sync failed
}

message DocFile {
  string source_uri = 1; // repo://<owner>/<repo>/<path>
  string owner = 2;
  string repo = 3;
  string path = 4;
  int64 updated_at = 5; // unix seconds of the last ingest that changed it
  string web_url = 6;   // the file on GitHub at the indexed commit
  int32 chunks = 7;     // chunks held in the store
  int64 ingested_at = 8; // unix seconds of the latest store of any chunk
}

message GetDocumentRequest {
  string source_uri = 1;
}

// Document is a source rebuilt from its chunks: what retrieval sees, close to
// but not exactly the original.
message Document {
  string source_uri = 1;
  string source_type = 2;
  string scope = 3;
  repeated string tags = 4;
  string text = 5;
  int32 chunks = 6;
  bool malformed = 7; // chunk order was incomplete; text is best effort
  bool oversize = 8;  // too large to return (over 3 MiB); text is empty
  string web_url = 9; // where the original lives, when known
  string writer = 10;       // which part of orchd stored it (docs, sources, session, file, client)
  string content_hash = 11; // identifies the stored text
  string trust = 12;        // the tier its writer gave it
}

message ListRegisteredSourcesRequest {}

message ListRegisteredSourcesResponse {
  repeated RegisteredSource sources = 1;
}

message RegisteredSource {
  string id = 1;   // <kind>|<uri>; set by orchd
  string kind = 2; // web | repo | owner
  string uri = 3;  // a URL, an absolute local path, or a directory name
  string scope = 4;
  repeated string tags = 5;
  int64 refresh_secs = 6;
  int64 last_fetched = 7; // unix seconds; 0 = due now
  string status = 8;      // new | ok | missing | error
  string web_url = 9;     // for web sources
  // What a search within this source passes: source_uri for one URL,
  // all_tags for a repo or owner's docs.
  string search_source_uri = 10;
  repeated string search_all_tags = 11;
}

message SaveSourceRequest {
  RegisteredSource source = 1; // kind, uri, scope, tags, refresh_secs
  // replace_id names the entry being edited when the kind or uri changed;
  // it is removed once the new one is stored. Its indexed content is kept.
  string replace_id = 2;
}

message RemoveSourceRequest {
  string id = 1;
  bool purge = 2;   // also delete everything the source indexed
  bool confirm = 3; // required with purge: deletion is permanent
}

message RemoveSourceResponse {
  int32 purged_sources = 1; // indexed sources deleted
  int32 purged_chunks = 2;
}

message RefreshSourceRequest {
  string id = 1; // empty = every source
  // let the next refresh of this source remove more docs than the prune cap
  // allows (needs id)
  bool confirm_prune = 2;
}

message RefreshSourceResponse {
  int32 marked = 1;
}

message GetSafetyNetRequest {}

message InstallSafetyNetRequest {
  // rules_only rewrites the orch-guards rulebook and rule.json and runs no
  // plugin command (the app's Repair rules).
  bool rules_only = 1;
}

message SafetyNetState {
  // state: missing, legacy, outdated, disabled or ok.
  string state = 1;
  bool ok = 2; // plugin ok and rules ok
  string pinned_version = 3;
  string pinned_sha = 4;
  string installed_version = 5; // empty when not installed by orch
  string installed_sha = 6;
  repeated SafetyNetInstall legacy = 7; // competing copies from other marketplaces
  SafetyNetRules rules = 8;
  repeated string errors = 9;   // plugin files that could not be read
  SafetyNetAction action = 10;  // running or last install action
  string pinned_released_on = 11; // YYYY-MM-DD
}

message SafetyNetInstall {
  string id = 1; // plugin@marketplace
  string scope = 2;
  string version = 3;
}

message SafetyNetRules {
  bool ok = 1;
  string config_path = 2;
  bool config_exists = 3;
  string config_error = 4;
  bool referenced = 5;        // rule.json lists orch-guards
  bool rtk_wrapper = 6;       // rtk is a transparent wrapper
  bool rulebook_current = 7;  // the orch-guards file matches this build
  repeated SafetyNetRulebook rulebooks = 8;
  repeated string problems = 9;
}

message SafetyNetRulebook {
  string source = 1; // as listed in rule.json
  string name = 2;
  string owner = 3;  // orch or user
  bool remote = 4;
  string version = 5;
  string description = 6;
  string error = 7;  // missing or invalid: cc-safety-net skips it
  repeated SafetyNetRule rules = 8;
}

message SafetyNetRule {
  string name = 1;
  string command = 2;
  string subcommand = 3;
  repeated string block_args = 4;
  string reason = 5;
  bool off = 6; // overridden to off in rule.json
}

message SafetyNetAction {
  bool running = 1;
  bool rules_only = 2;
  int64 started_at = 3;  // unix seconds; 0 = never run
  int64 finished_at = 4; // 0 while running
  string step = 5;       // the step running, or the last one
  bool ok = 6;
  string error = 7;
  string log = 8;        // command output, capped
}

message ListSettingsRequest {
  string provider = 1; // empty: every provider
  string kind = 2;     // empty: every kind
}

message ListSettingsResponse {
  repeated SettingsProvider providers = 1;
  repeated SettingItem items = 2;
  // revision changes whenever an item or a provider's state changes.
  int64 revision = 3;
}

message SettingsProvider {
  string name = 1;  // stable key, e.g. claude-code
  string title = 2;
  repeated SettingKind kinds = 3;
  repeated string files = 4; // the files it reads and writes
  string error = 5;          // why its files could not be read or parsed
  int64 observed_at = 6;     // unix seconds of the last look; 0 = never
}

message SettingKind {
  string name = 1; // e.g. hook, permission, plugin, rule
  string title = 2;
  string group_title = 3; // what an item's group is: an event, a list, ...
  bool addable = 4;
  bool removable = 5;
  // state_in_file: turning an item off records off in the file; otherwise
  // the item is taken out of the file and orch keeps it.
  bool state_in_file = 6;
  repeated SettingField fields = 7; // the add form
}

message SettingField {
  string name = 1;
  string label = 2;
  string type = 3; // string, text, int, bool or enum
  bool required = 4;
  repeated string options = 5; // enum values
  string help = 6;
  string placeholder = 7;
}

message SettingItem {
  string provider = 1;
  string kind = 2;
  string identity = 3;
  bool enabled = 4; // desired state
  string origin = 5; // orch, you or found
  // status: active, disabled (turned off in orch), removed (taken out of
  // its file outside orch) or missing (an orch item orch install restores).
  string status = 6;
  string group = 7;
  string summary = 8;
  string payload_json = 9; // what is written back to the file
  int64 created_at = 10;
  int64 updated_at = 11;
}

message SetSettingEnabledRequest {
  string provider = 1;
  string kind = 2;
  string identity = 3;
  bool enabled = 4;
}

message AddSettingRequest {
  string provider = 1;
  string kind = 2;
  map<string, string> fields = 3; // by SettingField.name
}

message RemoveSettingRequest {
  string provider = 1;
  string kind = 2;
  string identity = 3;
}

message RemoveSettingResponse {}

message ListPRReviewsRequest {}

message ListPRReviewsResponse {
  repeated PRReview reviews = 1; // most recently changed first
}

// PRReview is one PR orchd watches for review. Reason and comment come from a
// review of other people's code, so clients show them verbatim, never rendered.
message PRReview {
  string url = 1;
  string repo = 2;          // owner/name
  int32 number = 3;
  string mode = 4;          // verdict | approve | comment | feedback | auto
  string state = 5;         // waiting | held | reviewing | verdict | failed | closed | stopped
  string head_sha = 6;      // the commit the verdict covers
  string pending_sha = 7;   // the commit under review
  string task_id = 8;       // the review task
  string verdict = 9;       // approve | wait | changes; empty before the first
  string reason = 10;
  string comment = 11;      // the drafted review comment
  string posted = 12;       // approved | commented | failed | none, for head_sha; empty when nothing yet
  string note = 13;         // the last problem, or why nothing was posted
  int64 created_at = 14;    // unix seconds
  int64 updated_at = 15;
  int64 verdict_at = 16;    // 0 before the first verdict
  // when orchd last read the PR from GitHub (0 before its first read since it
  // started) and when it reads it next (0 while reviewing or inactive); set by
  // ListPRReviews
  int64 checked_at = 17;
  int64 next_check_at = 18;
  string instructions = 19; // the user's notes for this PR's reviews
  bool go_ahead = 20;       // the next ready commit is reviewed despite an untrusted author
  // the review's answer to the user's notes, and its full text; for the user
  // only, never posted
  string for_user = 21;
  string report = 22;
  // a later comment edits orch's earlier one on the PR rather than adding another
  bool update_in_place = 23;
  // how the PR's reviews are set up: where the project's instructions,
  // skills and agents come from (default | base | head | none), what the diff
  // is taken against (base | default), and whether the repo's Claude Code
  // settings, hooks and MCP servers apply ("" automatic | on | off)
  string instructions_from = 24;
  string compare_against = 25;
  string project_hooks = 26;
}

message WatchPRReviewRequest {
  string url = 1;           // https://github.com/<owner>/<repo>/pull/<n>
  string mode = 2;          // verdict | approve | comment | feedback | auto
  bool set_comment = 3;     // replace the drafted comment with comment
  string comment = 4;
  // replace the user's notes for this PR's reviews (≤ 4000 bytes); new notes
  // on a PR with a verdict review its current commit again
  bool set_instructions = 5;
  string instructions = 6;
  // review the next ready commit even though its author is not the repo's
  // owner, a member or a collaborator (whose PRs are otherwise held)
  bool review_anyway = 7;
  // replace whether a later comment edits orch's earlier one on the PR
  bool set_update_in_place = 8;
  bool update_in_place = 9;
  // replace how the PR's reviews are set up (see PRReview); a new setup on a
  // PR with a verdict reviews its current commit again
  bool set_setup = 10;
  string instructions_from = 11;
  string compare_against = 12;
  string project_hooks = 13;
}

message SetPRReviewUpdateInPlaceRequest {
  string url = 1;
  bool update_in_place = 2;
}

message StopPRReviewRequest {
  string url = 1;
  bool forget = 2;          // delete the review and its verdict too
}

message StopPRReviewResponse {}

message GetPRDetailRequest {
  string url = 1;
  bool refresh = 2;         // bypass the one-minute cache
}

// PRDetail is a PR's metadata as gh reports it. Title, body, labels and paths
// are other people's text: shown verbatim, never rendered.
message PRDetail {
  string url = 1;
  string title = 2;
  string body = 3;          // cut to 8000 bytes
  string author = 4;
  string state = 5;         // OPEN | MERGED | CLOSED
  bool is_draft = 6;
  string base_ref = 7;
  string head_ref = 8;
  string head_sha = 9;
  int32 additions = 10;
  int32 deletions = 11;
  int32 changed_files = 12;
  string created_at = 13;   // RFC 3339
  string updated_at = 14;
  string mergeable = 15;    // MERGEABLE | CONFLICTING | UNKNOWN
  string review_decision = 16;
  string ci_state = 17;     // none | failure | pending | success
  repeated string labels = 18;
  repeated string requested_reviewers = 19;
  repeated PRReviewerState reviews = 20;
  repeated PRCheck checks = 21;
  repeated PRFile files = 22; // at most 100
  int64 fetched_at = 23;    // unix seconds
}

message PRReviewerState {
  string login = 1;
  string state = 2;         // APPROVED | CHANGES_REQUESTED | COMMENTED | ...
}

message PRCheck {
  string name = 1;
  string result = 2;        // success | failure | pending | ... (lowercase)
}

message PRFile {
  string path = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

message GetTaskActivityRequest {
  string id = 1;
}

message TaskActivityStep {
  string at = 1;     // RFC 3339, empty when the transcript has no time
  string kind = 2;   // read | edit | run | agent | other
  string text = 3;   // the command, path or pattern, redacted and capped
  string risk = 4;   // what makes it risky ("git push"), empty when it is not
  string tool = 5;   // the tool's name
  string title = 6;  // one line for the step: its main command, or a path
  string detail = 7; // the full command or pattern, redacted, capped, keeping its lines
  repeated string commands = 8;  // a shell step's commands, in order, capped
  bool failed = 9;   // the tool reported an error
  string output = 10;      // the end of what it returned, redacted; newest steps only
  int64 duration_ms = 11;  // until its result arrived; 0 when not known
  int32 additions = 12;    // lines an edit adds
  int32 deletions = 13;    // lines an edit removes
  int32 seq = 14;          // its place among all steps read, stable across polls
  bool finished = 15;      // its result has arrived
  int32 command_total = 16;  // commands in the step, including those not listed
}

message TaskActivityTool {
  string name = 1;
  int32 count = 2;
}

message TaskActivityFile {
  string path = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

message TaskActivity {
  bool available = 1;                   // false: no transcript (a Codex run, or not started)
  repeated TaskActivityStep steps = 2;  // oldest first; older plain steps are dropped past the limit
  int32 total = 3;                      // steps read, including dropped ones
  repeated TaskActivityTool tools = 4;  // each tool used, most used first
  repeated TaskActivityFile files_edited = 5;  // capped
  int32 files_read = 6;                 // distinct files read
  int32 commands = 7;                   // shell commands run
  int32 failed = 8;                     // steps that reported an error
  string started_at = 9;                // the first step's time
  string last_at = 10;                  // the last step's time
  bool pushed = 11;                     // a step ran git push, listed or not
  int32 risky = 12;                     // risky steps, listed or not
}

message PRLandingRequest {
  string task_id = 1;
}

message ListPRLandingsRequest {}

message PRLandingDecision {
  string task_id = 1;
  string url = 2;
  string state = 3;
}

message ListPRLandingsResponse {
  repeated PRLandingDecision decisions = 1;
}

message LandPRRequest {
  string task_id = 1;
  string sha = 2;     // the commit the user reviewed; anything else is refused
}

message DiscardPRLandingRequest {
  string task_id = 1;
  bool restore = 2;
}

message PRLandingCommit {
  string sha = 1;
  string subject = 2;
  string author = 3;
}

message PRLanding {
  string task_id = 1;
  string url = 2;
  // none | proposed | stale | invalid | on_pr | landed | undone | discarded
  string state = 3;
  string problem = 4;       // why it is stale or invalid
  string path = 5;          // the worktree the proposal came from
  string branch = 6;        // the PR's head branch
  string base_sha = 7;      // the PR's head the commit builds on
  string sha = 8;           // the proposed commit
  repeated PRLandingCommit commits = 9;
  int32 total_commits = 10;
  repeated PRFile files = 11;
  string diff = 12;         // capped; other people's text, shown verbatim
  bool diff_truncated = 13;
  bool can_land = 14;
  string blocked = 15;      // why it cannot land, for the user
  bool can_undo = 16;
  string revert_sha = 17;
  int64 decided_at = 18;    // unix seconds
  int32 total_files = 19;   // files may list fewer
  int32 additions = 20;
  int32 deletions = 21;
  int32 binary_files = 22;  // their changes show in no line count or diff
}

// EnforcementSwitch is one enforcement layer's switch (SP-070).
message EnforcementSwitch {
  string layer = 1;          // memory | guard | terms | sandbox | hooks
  string title = 2;          // the layer for people
  string state = 3;          // on | off; the guard: off | log | block-other-jobs | strict
  string default_state = 4;
  repeated string states = 5;
  bool relaxed = 6;          // the layer is not enforcing: off, or the guard in log
  int64 set_at = 7;          // unix seconds; 0 when never switched
  string set_by = 8;         // shown to the operator only
  int64 until = 9;           // unix seconds a timed switch reverts; 0 untimed
  string reverts_to = 10;    // the state a timed switch reverts to
  // Why the layer does not enforce though its switch is on (relaxed is
  // then set): today, tool hooks turned off or removed in Claude Code's
  // settings outside the switch.
  string problem = 11;
}

message GetEnforcementRequest {}

message EnforcementState {
  repeated EnforcementSwitch switches = 1;
  // Set when orchd could not read the switches at startup, or orch.db's
  // differ from the ones orchd enforces (changed outside orchd); the
  // affected layers enforce.
  string error = 2;
  // The sandbox setting (D-61), which is not a switch: it never marks a
  // session's start digest.
  SandboxSetting sandbox_setting = 3;
}

// SandboxSetting is whether orch writes its sandbox rules (spaces D-61):
// auto writes them only for sessions another isolated space's folders are
// denied to, on always while a policy is applied, off never.
message SandboxSetting {
  string mode = 1;           // auto | on | off
  string default_mode = 2;   // auto
  repeated string modes = 3;
  int64 set_at = 4;          // unix seconds; 0 when never set
  string set_by = 5;         // shown to the operator only
  // Whether some space's sessions get orch's sandbox rules now: false
  // with off, with auto when no space has another isolated space's
  // folders to deny, with no policy, or while the sandbox switch is off.
  bool active = 6;
  // The state in words, for orch status and the app.
  string detail = 7;
  // Set when orch.db's setting differs from orchd's or did not match its
  // change log at startup (the setting is then auto).
  string problem = 8;
}

message SetSandboxSettingRequest {
  string mode = 1;           // auto | on | off
}

message SetSandboxSettingResponse {
  SandboxSetting current = 1;
  bool changed = 2;          // false when the setting already had that mode
}

message SetEnforcementRequest {
  string layer = 1;
  string state = 2;
  // A timed switch: it reverts to the state before it after this many
  // seconds (at most 24 hours). 0 sets it until changed again.
  int64 for_seconds = 3;
}

message SetEnforcementResponse {
  EnforcementSwitch current = 1;
  bool changed = 2;          // false when the layer already had that state
  // What else the switch did or could not do, for the operator.
  repeated string notes = 3;
}

message ListOutboundRulesRequest {}

// OutboundRule is one rule of the outbound terms check, without its value.
message OutboundRule {
  string id = 1;        // a baseline rule id, or user-<n>
  string kind = 2;      // baseline | command | destination | fail_closed
  bool on = 3;
  bool loosens = 4;     // a baseline rule that reads more than the strict reading (D-60)
  string summary = 5;   // what the rule (or its kind) does; never its value
  bool baseline = 6;
}

// OutboundRuleChange is one change of the rules, without any value.
message OutboundRuleChange {
  int64 revision = 1;
  int64 at = 2;         // unix seconds
  string by = 3;
  string action = 4;    // enable | disable | add | remove
  string rule_id = 5;
}

message OutboundRules {
  repeated OutboundRule rules = 1; // baseline rules first, then added ones
  int64 revision = 2;              // 0: the baseline, never changed
  int64 set_at = 3;                // unix seconds of the last change; 0 for none
  string set_by = 4;               // the operator only
  // Set when orch.db's rules could not be read: the check then refuses
  // every shell command and MCP tool while terms apply.
  string problem = 5;
  // The terms layer's switch (SP-070): with it off, no rule applies.
  string terms_layer = 6;
  repeated OutboundRuleChange history = 7; // newest first; the operator only
  repeated string kinds = 8;               // the kinds a rule may be added as
}

message ChangeOutboundRuleRequest {
  string action = 1;    // enable | disable | add | remove
  string id = 2;        // the rule, for enable, disable and remove
  string kind = 3;      // for add: command | destination | fail_closed
  string value = 4;     // for add; never echoed, logged or returned
}

message ChangeOutboundRuleResponse {
  string rule_id = 1;   // the rule changed; for add, the new rule's id
  bool changed = 2;     // false when nothing changed
  int64 revision = 3;   // the rules revision after the change
  OutboundRules current = 4;
}

message GetSpaceTermsRequest {}

// SpaceTerms is one space's outbound terms file, described without a term.
message SpaceTerms {
  string space = 1;
  string terms_file = 2;  // the path as the policy writes it; "" for none
  bool exists = 3;        // the file is there
  int32 count = 4;        // terms it holds, as the outbound check reads it
  // The first 12 hex digits of an HMAC-SHA256 of the file, keyed with a
  // secret kept in orchd's data folder, so a short term cannot be found
  // from it by trying words; it changes whenever the file changes.
  string fingerprint = 5;
  // Why the file cannot be read or parsed; it names a line, never a term.
  string problem = 6;
}
message SpaceTermsList {
  repeated SpaceTerms spaces = 1; // the applied policy's spaces, by name
}
message SetSpaceTermsRequest {
  string space = 1;
  string terms = 2;  // the whole file; never echoed, logged or returned
}

// SearchDirectMessagesRequest is a search that keeps chat direct messages in
// (SP-060).
message SearchDirectMessagesRequest {
  SearchRequest search = 1;
}

// OperatorUnlock is one unlock (SP-077): a terminal's request for operator
// scope and, once Orch.app confirms it, the grant to the requesting process
// and its descendants.
message OperatorUnlock {
  string id = 1;
  string state = 2;              // pending | confirmed (waiting for the code) | active
  int64 for_seconds = 3;         // how long the grant lasts once confirmed
  int32 pid = 4;                 // the requesting process
  string command = 5;            // its command line, as orchd read it
  repeated string ancestry = 6;  // its parents' programs, nearest first
  int64 requested_at = 7;        // unix seconds
  int64 expires_at = 8;          // pending and confirmed: when the request lapses; active: when the grant ends
  string code = 9;               // confirmed, to Orch.app only: the code the user types in the terminal
  string executable = 10;        // the requesting process's executable, as the kernel reports it
  string tty = 11;               // its controlling terminal, as the kernel reports it (e.g. ttys003); "" for none
}

message RequestUnlockRequest {
  int64 for_seconds = 1;         // 1 to 3600
}

message RequestUnlockResponse {
  OperatorUnlock unlock = 1;     // confirmed: send the code Orch.app shows with ProveUnlock
}

message ProveUnlockRequest {
  string id = 1;
  string code = 2;               // as Orch.app shows it, e.g. 482-913
}

message ProveUnlockResponse {
  OperatorUnlock unlock = 1;     // active
}

message ListUnlocksRequest {}

message ListUnlocksResponse {
  repeated OperatorUnlock unlocks = 1; // pending first, then active, oldest first
}

message ConfirmUnlockRequest {
  string id = 1;
  bool allow = 2;                // false denies
}

message ConfirmUnlockResponse {
  OperatorUnlock unlock = 1;     // confirmed, with its code, when allowed; empty when denied
}

message LockRequest {
  string id = 1;                 // "" for every unlock the caller may end
}

message LockResponse {
  int32 ended = 1;
}

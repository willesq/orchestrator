syntax = "proto3";

package orchd.v1;

option go_package = "github.com/willesq/orchestrator/internal/rpc/orchdv1;orchdv1";

// Orchd is the local control-plane the CLI, hooks, and MCP servers dial over a
// Unix-domain socket.
service Orchd {
  // Ping is a liveness/health check.
  rpc Ping(PingRequest) returns (PingResponse);
  // Ingest chunks, embeds, and stores text in the vector store.
  rpc Ingest(IngestRequest) returns (IngestResponse);
  // Search embeds the query and returns the top matching chunks.
  rpc Search(SearchRequest) returns (SearchResponse);
  // ListSources enumerates the distinct sources held in the vector store, with
  // per-source chunk counts. This is the store's inventory, as opposed to the
  // cadence-refresh registry that `orch source list` reports.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // DeleteSource removes every chunk belonging to one source_uri.
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
  // Dispatch enqueues a durable agent-task workflow and returns its instance ID.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  // ListTasks returns dispatched tasks, newest first, optionally by status.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // GetTask returns one dispatched task by ID.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Status reports orchd's own health plus one entry per supervised subsystem.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Restart restarts one supervised subsystem in place — no process bounce.
  // An empty name restarts every subsystem.
  rpc Restart(RestartRequest) returns (RestartResponse);
  // SummarizeSession queues a finished session for a model-written summary,
  // which replaces the excerpt in its session record. It returns at once.
  rpc SummarizeSession(SummarizeSessionRequest) returns (SummarizeSessionResponse);
  // RecommendModel answers which model a task of one kind should run on, with
  // the evidence behind the answer.
  rpc RecommendModel(RecommendModelRequest) returns (RecommendModelResponse);
  // RateTask records the user's verdict on a finished task, evidence for routing.
  rpc RateTask(RateTaskRequest) returns (RateTaskResponse);
  // RetryTask runs a task again; the runner resumes its session when one
  // exists. Refused while the task's run is still active.
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  // CancelTask stops a pending or in-progress task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // WatchTasks streams task changes: a snapshot of the newest tasks, then
  // each task whose ledger row or live run changes, and a periodic tick with
  // the unsettled tasks so their liveness (last activity) stays current.
  rpc WatchTasks(WatchTasksRequest) returns (stream TaskEvent);
  // MigrateHybrid copies the RAG collection into a new hybrid one (dense plus
  // BM25 keyword vectors), re-chunking and re-embedding its text, and switches
  // to it. Without apply it only plans. The old collection is kept.
  rpc MigrateHybrid(MigrateHybridRequest) returns (MigrateHybridResponse);
  // DropBackup deletes the backup collection a migration kept; plans unless apply.
  rpc DropBackup(DropBackupRequest) returns (DropBackupResponse);
  // ReindexKeywords recomputes, in place, the BM25 keyword vectors an older
  // tokenizer made, from each chunk's stored text; counts unless apply.
  // Resumable: chunks already re-indexed are skipped.
  rpc ReindexKeywords(ReindexKeywordsRequest) returns (ReindexKeywordsResponse);
  // ListPRs serves the PR babysitter's cache: the user's open PRs and PRs
  // awaiting their review, each with why it needs attention. Never calls gh.
  rpc ListPRs(ListPRsRequest) returns (ListPRsResponse);
  // GetGitHubIdentity returns the user's GitHub login, orgs and teams as gh
  // sees them; cached for 10 minutes unless refresh is set.
  rpc GetGitHubIdentity(GetGitHubIdentityRequest) returns (GitHubIdentity);
  // ListGitHubScopes returns what the GitHub watcher may monitor: the user's
  // own account (on by default) and each org they belong to (off by default).
  rpc ListGitHubScopes(ListGitHubScopesRequest) returns (ListGitHubScopesResponse);
  // SetGitHubScope turns a discovered scope on or off and sets what it covers.
  rpc SetGitHubScope(SetGitHubScopeRequest) returns (SetGitHubScopeResponse);
  // ListGitHubRepos lists the repos the user can see under an owner.
  rpc ListGitHubRepos(ListGitHubReposRequest) returns (ListGitHubReposResponse);
  // ListGitHubItems serves the watcher's cache: open PRs and issues in the
  // enabled scopes, each with why it is watched. Never calls gh.
  rpc ListGitHubItems(ListGitHubItemsRequest) returns (ListGitHubItemsResponse);
  // ListPRReviews lists the PRs the user asked orchd to review once ready,
  // each with where its review stands and the last verdict. Never calls gh.
  rpc ListPRReviews(ListPRReviewsRequest) returns (ListPRReviewsResponse);
  // WatchPRReview starts watching a PR for review, or changes what orchd may
  // post for it: nothing (verdict), an approval on an approve verdict
  // (approve), the drafted comment on any other verdict (feedback), both
  // (auto), or the drafted comment once, now (comment). The PR is checked
  // within seconds.
  rpc WatchPRReview(WatchPRReviewRequest) returns (PRReview);
  // StopPRReview stops watching a PR; forget also deletes its verdict.
  rpc StopPRReview(StopPRReviewRequest) returns (StopPRReviewResponse);
  // GetPRDetail reads one PR's metadata from GitHub (one gh call), cached for
  // a minute unless refresh is set.
  rpc GetPRDetail(GetPRDetailRequest) returns (PRDetail);
  // TailLogs returns orchd's recent log lines, kept in memory, after a
  // sequence number, so a caller can poll for new lines.
  rpc TailLogs(TailLogsRequest) returns (TailLogsResponse);
  // GetSystemMetrics reports resource use of orchd and the processes it runs,
  // the size of its data, and task counts.
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (SystemMetrics);
  // ListDocs lists the GitHub owners whose docs orchd keeps in sync, their
  // repos, and every doc of theirs the store holds, with its GitHub location.
  rpc ListDocs(ListDocsRequest) returns (ListDocsResponse);
  // GetDocument rebuilds one indexed source from its stored chunks.
  rpc GetDocument(GetDocumentRequest) returns (Document);
  // SyncDocs starts a docs sync now: one owner or every owner, and with force
  // a full re-ingest. Only one sync runs at a time; a request while one runs
  // is refused (Aborted), never queued.
  rpc SyncDocs(SyncDocsRequest) returns (DocsSyncState);
  // GetDocsSync reports the running docs sync, or the last one.
  rpc GetDocsSync(GetDocsSyncRequest) returns (DocsSyncState);
  // ListRegisteredSources lists the sources registered for refresh on a
  // cadence (web URLs, local repos, local owner directories).
  rpc ListRegisteredSources(ListRegisteredSourcesRequest) returns (ListRegisteredSourcesResponse);
  // SaveSource adds or updates a registered source.
  rpc SaveSource(SaveSourceRequest) returns (RegisteredSource);
  // RemoveSource unregisters a source, optionally deleting what it indexed.
  rpc RemoveSource(RemoveSourceRequest) returns (RemoveSourceResponse);
  // RefreshSource refreshes one registered source, or all, now.
  rpc RefreshSource(RefreshSourceRequest) returns (RefreshSourceResponse);
  // GetSafetyNet reports how cc-safety-net is installed in Claude Code
  // against the version this orch pins, the guard rules, and the last
  // install action. Read from plugin and rule files; runs no command.
  rpc GetSafetyNet(GetSafetyNetRequest) returns (SafetyNetState);
  // InstallSafetyNet installs, upgrades or repairs cc-safety-net and the
  // orch-guards rules, and returns the resulting state. One action runs at a
  // time; a request while one runs is refused (Aborted), never queued.
  rpc InstallSafetyNet(InstallSafetyNetRequest) returns (SafetyNetState);
  // ListSettings lists the settings orch manages in other tools' files
  // (Claude Code hooks, permission rules and plugins, cc-safety-net rules),
  // each with its desired state and origin, and each provider's kinds with
  // the fields an add form needs. It reads the files first, so the list
  // reflects changes made outside orch.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  // SetSettingEnabled turns one item on or off: it is written into, or
  // taken out of, its file at once, and the choice is kept in orch.db.
  rpc SetSettingEnabled(SetSettingEnabledRequest) returns (SettingItem);
  // AddSetting validates a new item (a hook or a permission rule), writes it
  // to its file and records it as added by you.
  rpc AddSetting(AddSettingRequest) returns (SettingItem);
  // RemoveSetting deletes an item you added or orch found from its file and
  // forgets it. Items orch install writes can only be turned off.
  rpc RemoveSetting(RemoveSettingRequest) returns (RemoveSettingResponse);
  // GetTaskActivity reads what a task's session has done so far from its
  // transcript: commands, edits and reads, with risky commands marked.
  rpc GetTaskActivity(GetTaskActivityRequest) returns (TaskActivity);
  // GetPRLanding shows the commit a task proposed for its PR, checked against
  // the PR's current head, and what the user decided about it.
  rpc GetPRLanding(PRLandingRequest) returns (PRLanding);
  // ListPRLandings lists the decided landings, without calling GitHub, so the
  // app can tell which proposals still wait on the user.
  rpc ListPRLandings(ListPRLandingsRequest) returns (ListPRLandingsResponse);
  // LandPR pushes the proposed commit to the PR's branch, fast-forward only.
  rpc LandPR(LandPRRequest) returns (PRLanding);
  // UndoPRLanding pushes a new commit restoring the tree the PR had before
  // the landing. It never rewrites history.
  rpc UndoPRLanding(PRLandingRequest) returns (PRLanding);
  // DiscardPRLanding sets a proposal aside, or with restore brings it back.
  rpc DiscardPRLanding(DiscardPRLandingRequest) returns (PRLanding);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  int64 uptime_seconds = 2;
}

message IngestRequest {
  string text = 1;
  string source_uri = 2;
  string source_type = 3;
  string scope = 4;
  repeated string tags = 5;
  // started_at and ended_at date the whole text (Unix seconds; 0 = unknown).
  int64 started_at = 6;
  int64 ended_at = 7;
  // timeline dates each chunk by the time markers in its own text instead.
  bool timeline = 8;
}

message IngestResponse {
  int32 chunks = 1;
}

message SearchRequest {
  string query = 1;
  int32 top_k = 2;
  string scope = 3;        // optional exact-match filter
  string source_type = 4;  // optional exact-match filter
  repeated string tags = 5; // optional: payload.tags contains any
  string mode = 6;          // optional: "hybrid" or "dense"; empty uses rag.search.mode
  // optional: only content dated within [since, until] (Unix seconds; 0 = open)
  int64 since = 7;
  int64 until = 8;
  string source_uri = 9;        // optional: only this source's content
  repeated string all_tags = 10; // optional: payload.tags contains every one
  // optional: most hits one source may return; 0 uses rag.search.per_source,
  // negative lifts the cap
  int32 per_source = 11;
  // optional: "weighted" (source type and recency) or "plain"; empty uses
  // rag.search.ranking
  string ranking = 12;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  // fallback says why a configured hybrid search answered by meaning only;
  // empty when the search ran as asked.
  string fallback = 2;
}

message SearchHit {
  string text = 1;
  string source_uri = 2;
  string source_type = 3;
  float score = 4;
  string scope = 5;
  repeated string tags = 6;
  float keyword_score = 7; // BM25 score; 0 when keyword search did not find it
  bool exact = 8;          // contains, verbatim, a code identifier from the query
  // when what the hit describes happened, and when it was stored
  // (Unix seconds; 0 = unknown)
  int64 started_at = 9;
  int64 ended_at = 10;
  int64 ingested_at = 11;
  string heading = 12; // the markdown section the chunk came from, if any
  // the trust tier orchd's writer gave it: repo, web, session, file or
  // client; empty for content stored before writers were recorded
  string trust = 13;
}

message ListSourcesRequest {
  string source_type = 1; // optional exact-match filter
  string scope = 2;       // optional exact-match filter
  string uri_prefix = 3;  // optional prefix filter, e.g. "session://"
  int32 limit = 4;        // 0 means no cap
  // optional: only sources with content dated within [since, until]
  // (Unix seconds; 0 = open)
  int64 since = 5;
  int64 until = 6;
}

message ListSourcesResponse {
  repeated SourceSummary sources = 1;
  int32 total_sources = 2; // distinct sources before `limit` was applied
  int32 total_chunks = 3;  // chunks across those sources
}

// SourceSummary is one distinct source_uri and what the store holds for it.
message SourceSummary {
  string source_uri = 1;
  string source_type = 2;
  string scope = 3;
  int32 chunks = 4;
  repeated string tags = 5;
  // span of the source's dated content, and its latest store
  // (Unix seconds; 0 = unknown)
  int64 started_at = 6;
  int64 ended_at = 7;
  int64 ingested_at = 8;
}

message DeleteSourceRequest {
  string source_uri = 1;
  // confirm must be set. Deletion is unrecoverable, so the gate lives here
  // rather than only in the CLI: every caller — CLI, MCP, a direct gRPC
  // client — has to opt in deliberately, not by omission.
  bool confirm = 2;
}

message DeleteSourceResponse {
  int32 deleted = 1; // chunks removed; 0 when the source was not present
}

message DispatchRequest {
  string agent = 1;
  string body = 2;
  string cwd = 3; // optional: absolute directory the agent session runs in
  // Optional routing. model ("provider/slug") pins the model; otherwise
  // task_kind picks one from the routing table. Neither runs the agent's own.
  string task_kind = 4;
  string model = 5;
}

message DispatchResponse {
  string instance_id = 1;
  bool worker_enabled = 2; // false: the task stays pending until a worker is enabled
  Route route = 3;           // the model chosen; unset when the dispatch was unrouted
}

message ListTasksRequest {
  string status = 1; // optional: pending | in_progress | complete | failed
  string agent = 2;  // optional exact-match filter
  int32 limit = 3;   // 0 defaults to 50
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskResponse {
  Task task = 1;
  bool found = 2;
}

// Task is one dispatched agent task as recorded in orch.db.
message Task {
  string id = 1;
  string agent = 2;
  string body = 3;
  string result = 4;
  string status = 5;
  string updated_at = 6;
  // Outcome metrics, set once the task finishes.
  double cost_usd = 7;
  int64 duration_ms = 8;
  int32 turns = 9;
  string session_id = 10;
  repeated string models = 11;
  repeated string prs = 12;
  string verification = 13; // passed: … | failed: … | skipped: …
  Route route = 14;          // the model the task was dispatched to, if routed
  string rating = 15;        // good | rework | bad, set by the user
  string pr_outcome = 16;    // good | rework | bad, from the fate of the task's PRs
  TaskRun run = 17;          // liveness; set by GetTask for a pending or in-progress task
}

// TaskRun is whether anything is working on a pending or in-progress task.
message TaskRun {
  // state is running (a session is live here), waiting (its workflow is
  // queued for a worker, or will be handed out again), or stalled (nothing
  // owns it; retry or cancel it).
  string state = 1;
  int64 pid = 2;            // the agent CLI process while running, else 0
  int64 started_at = 3;     // unix seconds the current session started, else 0
  int64 last_activity = 4;  // unix seconds the session transcript last changed, else 0
  string session_id = 5;
  string cwd = 6;
  string resume_command = 7; // how to open the session yourself, when there is one
}

message StatusRequest {}

message StatusResponse {
  string version = 1;
  int64 uptime_seconds = 2;
  repeated SubsystemStatus subsystems = 3;
  // migration is set while a hybrid migration runs.
  MigrationProgress migration = 4;
}

// MigrationProgress is how far a running hybrid migration has got.
message MigrationProgress {
  string target = 1;
  int32 sources_done = 2;
  int32 sources_total = 3;
  int32 chunks = 4;      // chunks written to the target so far
  int64 started_at = 5;  // unix seconds
}

// SubsystemStatus is one supervised unit's liveness, as `orch status` prints it.
message SubsystemStatus {
  string name = 1;
  string state = 2;       // running | stopped | failed
  string detail = 3;      // static descriptor, e.g. the qdrant port
  string error = 4;       // last start/stop failure, empty when healthy
  int64 started_at = 5;   // unix seconds; 0 when never started
  int64 last_beat = 6;    // unix seconds of the last tick; 0 when not tick-driven
  int32 restarts = 7;
}

message RestartRequest {
  string name = 1; // empty restarts every subsystem
}

message RestartResponse {
  repeated string restarted = 1;
}

message SummarizeSessionRequest {
  string session_id = 1;
  string transcript_path = 2; // absolute path to the harness's .jsonl transcript
  repeated string tags = 3;   // tags for the session record, as the hook ingested it
}

message SummarizeSessionResponse {
  bool accepted = 1; // false when summaries are off or the queue is full
}

// Route is one model choice for a task kind.
message Route {
  string task_kind = 1;
  string provider = 2;
  string model = 3;
  string effort = 4;     // empty: the model's default
  string rationale = 5;
  int32 evidence_n = 6;  // observed outcomes behind the choice
  string confidence = 7; // low | medium | high
}

message RecommendModelRequest {
  string task_kind = 1;
}

message RecommendModelResponse {
  Route route = 1;
  // false when the routing table had no usable route and the answer is a live
  // proposal from the declared-capability policy.
  bool from_table = 2;
}

message RateTaskRequest {
  string id = 1;
  string rating = 2; // good | rework | bad
}

message RateTaskResponse {}

message RetryTaskRequest {
  string id = 1;
}

message RetryTaskResponse {
  string run_id = 1; // the new workflow run
}

message CancelTaskRequest {
  string id = 1;
}

message CancelTaskResponse {
  string outcome = 1; // what happened, for the user
}

message WatchTasksRequest {
  string status = 1; // optional filter for the snapshot and changes, as ListTasks
  int32 limit = 2;   // snapshot size; 0 defaults to 50, max 500
}

// TaskEvent is one message of a WatchTasks stream.
message TaskEvent {
  // kind is snapshot (the newest tasks, replacing whatever the client
  // holds), changed (tasks whose state changed), or tick (the pending and
  // in-progress tasks' id, status, updated_at and run only: liveness to
  // merge into rows the client already has).
  string kind = 1;
  repeated Task tasks = 2;
}

message MigrateHybridRequest {
  string target = 1; // empty: <active collection>-hybrid
  bool apply = 2;    // false plans only
}

message MigrateHybridResponse {
  string from = 1;
  string to = 2;
  int32 sources = 3;
  int32 old_chunks = 4;
  int32 new_chunks = 5;
  int32 skipped = 6;
  bool applied = 7;
  int32 malformed = 8;  // sources whose chunk order could not be trusted; kept in stored order
  int32 orphans = 9;    // chunks with no source URI, which cannot be migrated
  int32 removed = 10;   // sources the target held that no longer exist
  int32 oversize = 11;  // sources too large to migrate; an applied run will not switch while any remain
  repeated string problems = 12; // some affected sources, and why
  string error = 13;             // set when the run failed or refused to switch; the counts are still reported
}

// DropBackupRequest names no collection: orchd only ever drops the backup
// recorded in config.
message DropBackupRequest {
  bool apply = 1;
}

message DropBackupResponse {
  string collection = 1;
  int64 points = 2;
  bool dropped = 3;
}

message ReindexKeywordsRequest {
  bool apply = 1;
}
message ReindexKeywordsResponse {
  string collection = 1;
  int32 tokenizer_version = 2;
  int64 total = 3;   // chunks in the collection
  int64 stale = 4;   // chunks an older tokenizer indexed, before this run
  int64 updated = 5; // chunks this run re-indexed
  bool applied = 6;
  string error = 7;  // why an applied run stopped early; what it did is still reported
}

message ListPRsRequest {
  bool needs_me = 1; // only PRs that need attention
}

// ListPRsResponse lists PRs most urgent first (attention order, then repo and
// title).
message ListPRsResponse {
  repeated PullRequest prs = 1;
  int64 updated_at = 2; // unix seconds the cache was last written; 0 = never
}

message PullRequest {
  string url = 1;
  string title = 2;
  string repo = 3;             // owner/name
  string ci_state = 4;         // success | failure | pending | none
  string review_decision = 5;  // APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED | empty
  string mergeable = 6;        // MERGEABLE | CONFLICTING | UNKNOWN
  bool is_draft = 7;
  repeated string reasons = 8; // authored | review_requested
  // why it needs the user, most urgent reason only: ci_failed |
  // changes_requested | conflicts | review_requested | ready_to_merge; empty
  // when it does not
  string attention = 9;
}

message GetGitHubIdentityRequest {
  bool refresh = 1; // bypass the 10-minute cache
}

message GitHubIdentity {
  string login = 1;
  repeated string orgs = 2;
  repeated GitHubTeam teams = 3;
}

message GitHubTeam {
  string org = 1;
  string slug = 2;
  string name = 3;
}

message ListGitHubScopesRequest {
  bool refresh = 1; // rediscover orgs now rather than from the cache
}

message ListGitHubScopesResponse {
  repeated GitHubScope scopes = 1; // the user's account first, then orgs by name
  // set when GitHub could not be reached; the stored scopes are still listed
  string warning = 2;
}

message GitHubScope {
  string owner = 1;
  string kind = 2;      // user | org; fixed by discovery
  bool enabled = 3;
  string items = 4;     // involving | all
  string repo_mode = 5; // all | include | exclude
  repeated string repos = 6; // repo names within owner, for include/exclude
  int64 updated_at = 7; // unix seconds
}

message SetGitHubScopeRequest {
  // owner must be an existing scope; kind is ignored
  GitHubScope scope = 1;
}

message SetGitHubScopeResponse {
  GitHubScope scope = 1;
}

message ListGitHubReposRequest {
  string owner = 1;
}

message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1; // by name
}

message GitHubRepo {
  string name = 1;
  bool private = 2;
  bool archived = 3;
}

message ListGitHubItemsRequest {
  string kind = 1;  // optional: pr | issue
  string owner = 2; // optional: one account or org
}

// ListGitHubItemsResponse lists items most urgent first (PRs needing the
// user, by attention), then by repo and title.
message ListGitHubItemsResponse {
  repeated GitHubItem items = 1;
  int64 updated_at = 2; // unix seconds the cache was last written; 0 = never
}

message GitHubItem {
  string url = 1;
  string title = 2;
  string repo = 3;        // owner/name
  string kind = 4;        // pr | issue
  int32 number = 5;
  string author = 6;
  string updated_at = 7;  // RFC 3339
  bool is_draft = 8;
  string ci_state = 9;    // PRs the user authored or was asked to review
  string review_decision = 10;
  string mergeable = 11;
  // authored | assigned | review_requested | involved | all_open
  repeated string reasons = 12;
  string attention = 13;  // as on PullRequest; empty for issues
}

message TailLogsRequest {
  uint64 after_seq = 1; // only lines newer than this; 0 = from the oldest kept
  string source = 2;    // optional: one source, such as orchd or qdrant
  int32 limit = 3;      // most lines to return, newest kept; 0 = 500
}

message TailLogsResponse {
  repeated LogEntry entries = 1; // oldest first
  uint64 last_seq = 2;   // newest sequence logged; pass back as after_seq
  uint64 oldest_seq = 3; // oldest still kept; a gap means lines were dropped
  repeated string sources = 4; // every source seen so far, sorted
}

message LogEntry {
  uint64 seq = 1;
  int64 at_unix_ms = 2;
  string source = 3;
  string message = 4;
}

message GetSystemMetricsRequest {}

message SystemMetrics {
  int64 at_unix_ms = 1;
  repeated ProcessMetrics processes = 2;
  int32 goroutines = 3;
  uint64 heap_bytes = 4;     // orchd's live Go heap
  repeated DataSize data = 5;
  map<string, int32> tasks = 6; // task count by status
}

// ProcessMetrics describes one OS process orchd runs or depends on.
message ProcessMetrics {
  string name = 1;  // orchd | qdrant
  int32 pid = 2;    // 0 when not running
  uint64 rss_bytes = 3;
  double cpu_percent = 4; // of one core, since the previous call (or start)
  int64 uptime_seconds = 5;
  bool running = 6;
}

// DataSize is the on-disk size of one of orchd's stores.
message DataSize {
  string name = 1;
  string path = 2;
  uint64 bytes = 3;
}

message ListDocsRequest {}

message ListDocsResponse {
  repeated DocOwner owners = 1;
  // What the store holds for the synced owners, ordered by source_uri.
  repeated DocFile files = 2;
  bool truncated = 3;         // more files than one reply carries
  DocsSyncState sync = 4;
}

message SyncDocsRequest {
  string owner = 1; // empty = every owner
  bool force = 2;   // re-clone and re-ingest everything, not just what changed
  // let the next sync of this owner remove more docs than the prune cap
  // allows (needs owner)
  bool confirm_prune = 3;
}

message GetDocsSyncRequest {}

message DocsSyncState {
  bool running = 1;
  string owner = 2;       // being synced, or last synced
  int64 started_at = 3;   // unix seconds
  int64 finished_at = 4;  // unix seconds; 0 while running
  int32 done = 5;         // repos handled so far, of total
  int32 total = 6;
  string repo = 7;        // the last repo handled
}

message DocOwner {
  string owner = 1;
  int64 refresh_secs = 2;
  string scope = 3;
  repeated string tags = 4;
  int64 last_synced = 5; // unix seconds; 0 = never
  string status = 6;      // ok | partial | error | new
  repeated DocRepo repos = 7;
  string error = 8;       // why the last sync failed or stopped early
}

message DocRepo {
  string repo = 1;
  string head_sha = 2; // the default-branch commit last indexed
  int64 last_synced = 3;
  int32 files = 4;
  string status = 5;
  string web_url = 6; // https://github.com/<owner>/<repo>
  string error = 7;   // why the repo's last sync failed
}

message DocFile {
  string source_uri = 1; // repo://<owner>/<repo>/<path>
  string owner = 2;
  string repo = 3;
  string path = 4;
  int64 updated_at = 5; // unix seconds of the last ingest that changed it
  string web_url = 6;   // the file on GitHub at the indexed commit
  int32 chunks = 7;     // chunks held in the store
  int64 ingested_at = 8; // unix seconds of the latest store of any chunk
}

message GetDocumentRequest {
  string source_uri = 1;
}

// Document is a source rebuilt from its chunks: what retrieval sees, close to
// but not exactly the original.
message Document {
  string source_uri = 1;
  string source_type = 2;
  string scope = 3;
  repeated string tags = 4;
  string text = 5;
  int32 chunks = 6;
  bool malformed = 7; // chunk order was incomplete; text is best effort
  bool oversize = 8;  // too large to return (over 3 MiB); text is empty
  string web_url = 9; // where the original lives, when known
  string writer = 10;       // which part of orchd stored it (docs, sources, session, file, client)
  string content_hash = 11; // identifies the stored text
  string trust = 12;        // the tier its writer gave it
}

message ListRegisteredSourcesRequest {}

message ListRegisteredSourcesResponse {
  repeated RegisteredSource sources = 1;
}

message RegisteredSource {
  string id = 1;   // <kind>|<uri>; set by orchd
  string kind = 2; // web | repo | owner
  string uri = 3;  // a URL, an absolute local path, or a directory name
  string scope = 4;
  repeated string tags = 5;
  int64 refresh_secs = 6;
  int64 last_fetched = 7; // unix seconds; 0 = due now
  string status = 8;      // new | ok | missing | error
  string web_url = 9;     // for web sources
  // What a search within this source passes: source_uri for one URL,
  // all_tags for a repo or owner's docs.
  string search_source_uri = 10;
  repeated string search_all_tags = 11;
}

message SaveSourceRequest {
  RegisteredSource source = 1; // kind, uri, scope, tags, refresh_secs
  // replace_id names the entry being edited when the kind or uri changed;
  // it is removed once the new one is stored. Its indexed content is kept.
  string replace_id = 2;
}

message RemoveSourceRequest {
  string id = 1;
  bool purge = 2;   // also delete everything the source indexed
  bool confirm = 3; // required with purge: deletion is permanent
}

message RemoveSourceResponse {
  int32 purged_sources = 1; // indexed sources deleted
  int32 purged_chunks = 2;
}

message RefreshSourceRequest {
  string id = 1; // empty = every source
  // let the next refresh of this source remove more docs than the prune cap
  // allows (needs id)
  bool confirm_prune = 2;
}

message RefreshSourceResponse {
  int32 marked = 1;
}

message GetSafetyNetRequest {}

message InstallSafetyNetRequest {
  // rules_only rewrites the orch-guards rulebook and rule.json and runs no
  // plugin command (the app's Repair rules).
  bool rules_only = 1;
}

message SafetyNetState {
  // state: missing, legacy, outdated, disabled or ok.
  string state = 1;
  bool ok = 2; // plugin ok and rules ok
  string pinned_version = 3;
  string pinned_sha = 4;
  string installed_version = 5; // empty when not installed by orch
  string installed_sha = 6;
  repeated SafetyNetInstall legacy = 7; // competing copies from other marketplaces
  SafetyNetRules rules = 8;
  repeated string errors = 9;   // plugin files that could not be read
  SafetyNetAction action = 10;  // running or last install action
  string pinned_released_on = 11; // YYYY-MM-DD
}

message SafetyNetInstall {
  string id = 1; // plugin@marketplace
  string scope = 2;
  string version = 3;
}

message SafetyNetRules {
  bool ok = 1;
  string config_path = 2;
  bool config_exists = 3;
  string config_error = 4;
  bool referenced = 5;        // rule.json lists orch-guards
  bool rtk_wrapper = 6;       // rtk is a transparent wrapper
  bool rulebook_current = 7;  // the orch-guards file matches this build
  repeated SafetyNetRulebook rulebooks = 8;
  repeated string problems = 9;
}

message SafetyNetRulebook {
  string source = 1; // as listed in rule.json
  string name = 2;
  string owner = 3;  // orch or user
  bool remote = 4;
  string version = 5;
  string description = 6;
  string error = 7;  // missing or invalid: cc-safety-net skips it
  repeated SafetyNetRule rules = 8;
}

message SafetyNetRule {
  string name = 1;
  string command = 2;
  string subcommand = 3;
  repeated string block_args = 4;
  string reason = 5;
  bool off = 6; // overridden to off in rule.json
}

message SafetyNetAction {
  bool running = 1;
  bool rules_only = 2;
  int64 started_at = 3;  // unix seconds; 0 = never run
  int64 finished_at = 4; // 0 while running
  string step = 5;       // the step running, or the last one
  bool ok = 6;
  string error = 7;
  string log = 8;        // command output, capped
}

message ListSettingsRequest {
  string provider = 1; // empty: every provider
  string kind = 2;     // empty: every kind
}

message ListSettingsResponse {
  repeated SettingsProvider providers = 1;
  repeated SettingItem items = 2;
  // revision changes whenever an item or a provider's state changes.
  int64 revision = 3;
}

message SettingsProvider {
  string name = 1;  // stable key, e.g. claude-code
  string title = 2;
  repeated SettingKind kinds = 3;
  repeated string files = 4; // the files it reads and writes
  string error = 5;          // why its files could not be read or parsed
  int64 observed_at = 6;     // unix seconds of the last look; 0 = never
}

message SettingKind {
  string name = 1; // e.g. hook, permission, plugin, rule
  string title = 2;
  string group_title = 3; // what an item's group is: an event, a list, ...
  bool addable = 4;
  bool removable = 5;
  // state_in_file: turning an item off records off in the file; otherwise
  // the item is taken out of the file and orch keeps it.
  bool state_in_file = 6;
  repeated SettingField fields = 7; // the add form
}

message SettingField {
  string name = 1;
  string label = 2;
  string type = 3; // string, text, int, bool or enum
  bool required = 4;
  repeated string options = 5; // enum values
  string help = 6;
  string placeholder = 7;
}

message SettingItem {
  string provider = 1;
  string kind = 2;
  string identity = 3;
  bool enabled = 4; // desired state
  string origin = 5; // orch, you or found
  // status: active, disabled (turned off in orch), removed (taken out of
  // its file outside orch) or missing (an orch item orch install restores).
  string status = 6;
  string group = 7;
  string summary = 8;
  string payload_json = 9; // what is written back to the file
  int64 created_at = 10;
  int64 updated_at = 11;
}

message SetSettingEnabledRequest {
  string provider = 1;
  string kind = 2;
  string identity = 3;
  bool enabled = 4;
}

message AddSettingRequest {
  string provider = 1;
  string kind = 2;
  map<string, string> fields = 3; // by SettingField.name
}

message RemoveSettingRequest {
  string provider = 1;
  string kind = 2;
  string identity = 3;
}

message RemoveSettingResponse {}

message ListPRReviewsRequest {}

message ListPRReviewsResponse {
  repeated PRReview reviews = 1; // most recently changed first
}

// PRReview is one PR orchd watches for review. Reason and comment come from a
// review of other people's code, so clients show them verbatim, never rendered.
message PRReview {
  string url = 1;
  string repo = 2;          // owner/name
  int32 number = 3;
  string mode = 4;          // verdict | approve | comment | feedback | auto
  string state = 5;         // waiting | held | reviewing | verdict | failed | closed | stopped
  string head_sha = 6;      // the commit the verdict covers
  string pending_sha = 7;   // the commit under review
  string task_id = 8;       // the review task
  string verdict = 9;       // approve | wait | changes; empty before the first
  string reason = 10;
  string comment = 11;      // the drafted review comment
  string posted = 12;       // approved | commented | failed, for head_sha; empty when nothing
  string note = 13;         // the last problem, or why nothing was posted
  int64 created_at = 14;    // unix seconds
  int64 updated_at = 15;
  int64 verdict_at = 16;    // 0 before the first verdict
  // when orchd last read the PR from GitHub (0 before its first read since it
  // started) and when it reads it next (0 while reviewing or inactive); set by
  // ListPRReviews
  int64 checked_at = 17;
  int64 next_check_at = 18;
  string instructions = 19; // the user's notes for this PR's reviews
  bool go_ahead = 20;       // the next ready commit is reviewed despite an untrusted author
  // the review's answer to the user's notes, and its full text; for the user
  // only, never posted
  string for_user = 21;
  string report = 22;
}

message WatchPRReviewRequest {
  string url = 1;           // https://github.com/<owner>/<repo>/pull/<n>
  string mode = 2;          // verdict | approve | comment | feedback | auto
  bool set_comment = 3;     // replace the drafted comment with comment
  string comment = 4;
  // replace the user's notes for this PR's reviews (≤ 4000 bytes); new notes
  // on a PR with a verdict review its current commit again
  bool set_instructions = 5;
  string instructions = 6;
  // review the next ready commit even though its author is not the repo's
  // owner, a member or a collaborator (whose PRs are otherwise held)
  bool review_anyway = 7;
}

message StopPRReviewRequest {
  string url = 1;
  bool forget = 2;          // delete the review and its verdict too
}

message StopPRReviewResponse {}

message GetPRDetailRequest {
  string url = 1;
  bool refresh = 2;         // bypass the one-minute cache
}

// PRDetail is a PR's metadata as gh reports it. Title, body, labels and paths
// are other people's text: shown verbatim, never rendered.
message PRDetail {
  string url = 1;
  string title = 2;
  string body = 3;          // cut to 8000 bytes
  string author = 4;
  string state = 5;         // OPEN | MERGED | CLOSED
  bool is_draft = 6;
  string base_ref = 7;
  string head_ref = 8;
  string head_sha = 9;
  int32 additions = 10;
  int32 deletions = 11;
  int32 changed_files = 12;
  string created_at = 13;   // RFC 3339
  string updated_at = 14;
  string mergeable = 15;    // MERGEABLE | CONFLICTING | UNKNOWN
  string review_decision = 16;
  string ci_state = 17;     // none | failure | pending | success
  repeated string labels = 18;
  repeated string requested_reviewers = 19;
  repeated PRReviewerState reviews = 20;
  repeated PRCheck checks = 21;
  repeated PRFile files = 22; // at most 100
  int64 fetched_at = 23;    // unix seconds
}

message PRReviewerState {
  string login = 1;
  string state = 2;         // APPROVED | CHANGES_REQUESTED | COMMENTED | ...
}

message PRCheck {
  string name = 1;
  string result = 2;        // success | failure | pending | ... (lowercase)
}

message PRFile {
  string path = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

message GetTaskActivityRequest {
  string id = 1;
}

message TaskActivityStep {
  string at = 1;     // RFC 3339, empty when the transcript has no time
  string kind = 2;   // read | edit | run | agent | other
  string text = 3;   // the command, path or pattern, redacted and capped
  string risk = 4;   // what makes it risky ("git push"), empty when it is not
}

message TaskActivity {
  bool available = 1;                   // false: no transcript (a Codex run, or not started)
  repeated TaskActivityStep steps = 2;  // oldest first; older plain steps are dropped past the limit
  int32 total = 3;                      // steps read, including dropped ones
}

message PRLandingRequest {
  string task_id = 1;
}

message ListPRLandingsRequest {}

message PRLandingDecision {
  string task_id = 1;
  string url = 2;
  string state = 3;
}

message ListPRLandingsResponse {
  repeated PRLandingDecision decisions = 1;
}

message LandPRRequest {
  string task_id = 1;
  string sha = 2;     // the commit the user reviewed; anything else is refused
}

message DiscardPRLandingRequest {
  string task_id = 1;
  bool restore = 2;
}

message PRLandingCommit {
  string sha = 1;
  string subject = 2;
  string author = 3;
}

message PRLanding {
  string task_id = 1;
  string url = 2;
  // none | proposed | stale | invalid | on_pr | landed | undone | discarded
  string state = 3;
  string problem = 4;       // why it is stale or invalid
  string path = 5;          // the worktree the proposal came from
  string branch = 6;        // the PR's head branch
  string base_sha = 7;      // the PR's head the commit builds on
  string sha = 8;           // the proposed commit
  repeated PRLandingCommit commits = 9;
  int32 total_commits = 10;
  repeated PRFile files = 11;
  string diff = 12;         // capped; other people's text, shown verbatim
  bool diff_truncated = 13;
  bool can_land = 14;
  string blocked = 15;      // why it cannot land, for the user
  bool can_undo = 16;
  string revert_sha = 17;
  int64 decided_at = 18;    // unix seconds
  int32 total_files = 19;   // files may list fewer
  int32 additions = 20;
  int32 deletions = 21;
  int32 binary_files = 22;  // their changes show in no line count or diff
}
